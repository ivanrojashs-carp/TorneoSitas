<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Liga Femenina de Maxi Handball</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="theme-color" content="#A91B60"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Maxi Handball"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    body{margin:0;transition:background .3s;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
    button{font-family:inherit}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:.8}to{transform:translateY(0);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(169,27,96,.15)}50%{box-shadow:0 0 20px rgba(169,27,96,.3)}}
    .fade-in{animation:fadeIn .5s cubic-bezier(.22,1,.36,1) both}
    .slide-up{animation:slideUp .4s cubic-bezier(.22,1,.36,1) both}
    .skeleton{animation:pulse 1.5s ease-in-out infinite;border-radius:8px}
    .btn-press{transition:transform .15s,box-shadow .2s}
    .btn-press:active{transform:scale(.95)}
    .card-hover{transition:border-color .3s,box-shadow .3s,transform .2s}
    .card-hover:active{transform:scale(.985)}
    .zone-btn{transition:all .3s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
    .zone-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
    .zone-btn:active::after{left:100%}
    .glass{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    @keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}
    @keyframes ovIn{from{opacity:0}to{opacity:1}}
    .pop-in{animation:popIn .38s cubic-bezier(.22,1,.36,1) both}
    .ov-in{animation:ovIn .25s ease-out both}
    .glow-accent{animation:glowPulse 3s ease-in-out infinite}
    @keyframes floaty{50%{transform:translate(22px,16px) scale(1.12)}}
    @keyframes ping{0%{box-shadow:0 0 0 0 rgba(169,27,96,.5)}100%{box-shadow:0 0 0 9px rgba(169,27,96,0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .blob{position:absolute;border-radius:50%;filter:blur(55px);opacity:.55;animation:floaty 12s ease-in-out infinite}
    .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#A91B60;animation:ping 1.6s infinite}
    .bar-grow{transform-origin:left;animation:grow .9s .25s cubic-bezier(.22,1,.36,1) both}
    .row-hover{transition:background .2s}
    .row-hover:hover{background:rgba(169,27,96,.07)}
    .lift{transition:transform .2s,border-color .2s,box-shadow .2s}
    .lift:hover{transform:translateY(-2px)}
    ::-webkit-scrollbar{display:none}
  </style>
</head>
<body>
<div id="root"></div>
<script>
window.API_URL="https://script.google.com/macros/s/AKfycbzYeCWNcNETEbNd1mV-DZPdTXaOxUqX5q3SmTwv1BJ7k81OyB2sb5i-FGmQgxfQ9Ihi/exec";
</script>
<script type="text/babel" data-presets="react">
const{useState,useEffect,useMemo,useCallback}=React;

// ============ TEMAS ============
const LIGHT={bg:"#F6F7FB",card:"#FFFFFF",cardAlt:"#F8F9FC",text:"#0F172A",textSec:"#475569",textMut:"#64748B",border:"#E8EAF2",shadow:"rgba(15,23,42,0.08)",overlay:"rgba(15,23,42,0.5)"};
const DARK={bg:"#0B0D14",card:"#141824",cardAlt:"#10131D",text:"#F1F5F9",textSec:"#A7B1C2",textMut:"#7C879B",border:"#242A3A",shadow:"rgba(0,0,0,0.5)",overlay:"rgba(0,0,0,0.7)"};
const ACCENT="#A91B60";
const ACCENT_DARK="#7B1145";
const F_D="Inter,sans-serif";
const F_B="Inter,sans-serif";
const F_M="Inter,sans-serif";

const TEMA={
  Verde:{bg:"#166534",bgL:"#dcfce7",ac:"#16a34a",acDark:"#4ade80",label:"ZONA VERDE",icon:"\u{1F7E2}"},
  Roja:{bg:"#991b1b",bgL:"#fee2e2",ac:"#dc2626",acDark:"#f87171",label:"ZONA ROJA",icon:"\u{1F534}"},
  Oro:{bg:"#92400e",bgL:"#fef3c7",ac:"#d97706",acDark:"#fbbf24",label:"ZONA ORO",icon:"\u{1F947}"},
  Plata:{bg:"#475569",bgL:"#f1f5f9",ac:"#64748b",acDark:"#94a3b8",label:"ZONA PLATA",icon:"\u{1F948}"},
};
const TABS=[{key:"tabla",label:"Tabla",icon:"\u{1F3C6}"},{key:"fixture",label:"Fixture",icon:"\u{1F4C5}"},{key:"goleadoras",label:"Goles",icon:"\u{1F3AF}"},{key:"noticias",label:"Noticias",icon:"\u{1F4F0}"}];

// ============ HELPERS ============
function jsonp(url){return new Promise((res,rej)=>{const cb="cb_"+Math.random().toString(36).slice(2);const s=document.createElement("script");window[cb]=d=>{res(d);delete window[cb];s.remove()};s.onerror=()=>{rej(new Error("API"));delete window[cb];s.remove()};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_ts="+Date.now();document.body.appendChild(s)})}
function minutosHora(h){const m=String(h||"").match(/(\d{1,2})\s*[:.;hH]\s*(\d{2})?/);return m?Number(m[1])*60+(Number(m[2])||0):99999}
function fechaCorta(f){if(!f)return"";const s=String(f).slice(0,10).split("-");return s.length===3?s[2]+"/"+s[1]+"/"+s[0].slice(2):String(f).slice(0,10)}
function equipoPorId(eq,id){return eq.find(e=>e.ID_Equipo===id)||{Nombre:id,Zona:""}}
function fotoDrive(u){if(!u)return null;const m=String(u).match(/\/d\/([a-zA-Z0-9_-]+)/);return m?"https://lh3.googleusercontent.com/d/"+m[1]:u}

// ============ TEMA CONTEXT ============
const ThemeCtx=React.createContext(LIGHT);
function useTheme(){return React.useContext(ThemeCtx)}

function Portal({children}){return ReactDOM.createPortal(children,document.body)}
function ini(n){return String(n||"").split(" ").filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function Shield({eq,size=32}){
  const f=fotoDrive(eq&&eq.Escudo_URL);
  if(f)return <img src={f} alt="" style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",flex:"none",boxShadow:"0 4px 10px -3px rgba(0,0,0,.25)"}}/>;
  return <div style={{width:size,height:size,borderRadius:"50%",flex:"none",display:"grid",placeItems:"center",color:"#FFF",fontWeight:800,fontSize:size*0.34,background:`linear-gradient(135deg,${ACCENT},${ACCENT_DARK})`}}>{ini(eq&&eq.Nombre).slice(0,2)}</div>}
function Chip({on,onClick,dot,children,grow}){
  const t=useTheme();
  return <button onClick={onClick} className="btn-press" style={{flex:grow?1:"none",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:7,whiteSpace:"nowrap",padding:"9px 14px",borderRadius:999,fontSize:11.5,fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",cursor:"pointer",transition:"all .25s",background:on?t.text:t.card,color:on?t.bg:t.text,border:`1px solid ${on?t.text:t.border}`}}>{dot&&<i style={{width:8,height:8,borderRadius:"50%",background:dot,display:"inline-block"}}/>}{children}</button>}
function Sec({children}){const t=useTheme();return <div className="text-[11px] font-bold uppercase px-1 mb-2 mt-1" style={{letterSpacing:".1em",color:t.textMut}}>{children}</div>}

// ============ DATA HOOK ============
function parseCfg(d){const c={};(d.configuracion||[]).forEach(x=>{c[x.Clave]=x.Valor});return{cargando:false,modoDemo:false,equipos:d.equipos||[],jugadoras:d.jugadoras||[],partidos:d.partidos||[],goles:d.goles||[],goleadoras:d.goleadoras||[],noticias:d.noticias||[],config:c}}
function useDatos(){
  const cached=(()=>{try{const c=localStorage.getItem("torneo_cache");return c?parseCfg(JSON.parse(c)):null}catch{return null}})();
  const[st,setSt]=useState(cached||{cargando:true,modoDemo:false,equipos:[],jugadoras:[],partidos:[],goles:[],goleadoras:[],noticias:[],config:{}});
  useEffect(()=>{const u=window.API_URL;if(!u||u.includes("PEGAR")){setSt(s=>({...s,cargando:false,modoDemo:true}));return}
    jsonp(`${u}?recurso=todo`).then(d=>{try{localStorage.setItem("torneo_cache",JSON.stringify(d))}catch{};setSt(parseCfg(d))}).catch(()=>{if(!cached)setSt(s=>({...s,cargando:false,modoDemo:true}))})
  },[]);return st}

// ============ POSICIONES ============
function calcPos(eqs,pts,cfg){
  const pV=Number(cfg.PuntosVictoria)||3,pE=Number(cfg.PuntosEmpate)||2,pD=Number(cfg.PuntosDerrota)||1;
  return eqs.map(eq=>{
    const pr=pts.filter(p=>p.Jugado==="SI"&&(p.ID_EquipoLocal===eq.ID_Equipo||p.ID_EquipoVisitante===eq.ID_Equipo));
    let pg=0,pe=0,pp=0,gf=0,gc=0;const fm=[];
    pr.slice().sort((a,b)=>(Number(a.Jornada)||0)-(Number(b.Jornada)||0)||new Date(a.Fecha)-new Date(b.Fecha)).forEach(p=>{
      const l=p.ID_EquipoLocal===eq.ID_Equipo;const gp=Number(l?p.GolesLocal:p.GolesVisitante);const gr=Number(l?p.GolesVisitante:p.GolesLocal);
      gf+=gp;gc+=gr;if(gp>gr){pg++;fm.push("G")}else if(gp===gr){pe++;fm.push("E")}else{pp++;fm.push("P")}
    });return{...eq,pj:pr.length,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*pV+pe*pE+pp*pD,racha:fm.slice(-5)}
  }).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf)}

// ============ SKELETON ============
function Skeleton(){const t=useTheme();return(
  <div className="px-4 py-6 space-y-3 fade-in">
    <div className="skeleton h-8 w-48" style={{background:t.border}}/>
    <div className="skeleton h-6 w-full" style={{background:t.border}}/>
    <div className="skeleton h-6 w-full" style={{background:t.border}}/>
    <div className="skeleton h-6 w-3/4" style={{background:t.border}}/>
    <div className="skeleton h-20 w-full mt-4" style={{background:t.border}}/>
  </div>
)}

// ============ MODAL EQUIPO ============
function ModalEquipo(props){return (props.equipo)?<Portal><ModalEquipoInner {...props}/></Portal>:null}
function ModalEquipoInner({equipo,jugadoras,onCerrar}){
  const t=useTheme();if(!equipo)return null;
  const esDT=j=>String(j.Dorsal).toUpperCase()==="DT";
  const pl=[...jugadoras.filter(j=>(j.ID_Equipo||"").toLowerCase()===(equipo.ID_Equipo||"").toLowerCase())];
  const lista=[...pl.filter(j=>!esDT(j)).sort((a,b)=>Number(a.Dorsal)-Number(b.Dorsal)),...pl.filter(j=>esDT(j))];
  return(
    <div className="fixed inset-0 z-50 flex items-end justify-center glass ov-in" style={{background:t.overlay}} onClick={onCerrar}>
      <div className="w-full max-w-md rounded-t-3xl p-5 slide-up" style={{background:t.card,maxHeight:"85vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            {fotoDrive(equipo.Escudo_URL)&&<img src={fotoDrive(equipo.Escudo_URL)} alt="" className="w-8 h-8 rounded-full" style={{objectFit:"cover"}}/>}
            <h3 style={{fontFamily:F_D,fontWeight:700,color:ACCENT,fontSize:20}}>{equipo.Nombre}</h3>
          </div>
          <button onClick={onCerrar} style={{color:t.textMut,fontSize:18}}>✕</button>
        </div>
        <div className="grid grid-cols-3 gap-2">
          {lista.map(j=>{const f=fotoDrive(j.Foto_URL);const dt=esDT(j);return(
            <div key={j.ID_Jugadora} className="rounded-xl p-2 text-center" style={{background:dt?ACCENT+"10":t.cardAlt,border:`1px solid ${dt?ACCENT+"33":t.border}`,transition:"transform .15s"}}>
              {f?<img src={f} alt="" className="w-14 h-14 rounded-full mx-auto mb-1.5" style={{objectFit:"cover",border:`2px solid ${ACCENT}`}}/>
              :<div className="w-14 h-14 rounded-full mx-auto mb-1.5 flex items-center justify-center text-xl" style={{background:t.border,color:t.textMut}}>{dt?"👔":"👤"}</div>}
              <div className="text-xs font-medium leading-tight" style={{color:t.text}}>{j.Nombre}</div>
              <div className="text-[10px] mt-0.5" style={{color:dt?ACCENT:t.textMut,fontWeight:700}}>{dt?"DT":`#${j.Dorsal}`}</div>
            </div>
          )})}
        </div>
        {lista.length===0&&<p className="text-sm text-center py-4" style={{color:t.textMut}}>Sin jugadoras cargadas.</p>}
      </div>
    </div>
  )}

// ============ TABLA GRUPO ============
function TablaGrupo({tema,posiciones,onEquipoClick,isDark}){
  const t=useTheme();const z=TEMA[tema]||TEMA.Verde;
  const ac=isDark?z.acDark:z.ac;
  const maxP=Math.max(1,...posiciones.map(e=>e.pts));
  const cols="18px minmax(0,1fr) 20px 20px 20px 20px 28px 28px";
  const cel={textAlign:"center",fontSize:12};
  return(
    <div className="mb-6 fade-in">
      <div className="flex items-center gap-2 mb-2 px-1">
        <span style={{width:9,height:9,borderRadius:99,background:ac,boxShadow:`0 0 0 4px ${ac}26`}}/>
        <span className="text-[11px] font-bold uppercase" style={{letterSpacing:".1em",color:t.text}}>{z.label}</span>
      </div>
      <div className="rounded-2xl overflow-hidden" style={{background:t.card,border:`1px solid ${t.border}`,boxShadow:`0 8px 24px -10px ${t.shadow}`}}>
        <div style={{display:"grid",gridTemplateColumns:cols,gap:3,alignItems:"center",padding:"0 10px",height:36,borderBottom:`1px solid ${t.border}`,fontSize:10,fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",color:t.textMut}}>
          <span>#</span><span>Equipo</span><span style={cel}>PJ</span><span style={cel}>PG</span><span style={cel}>PE</span><span style={cel}>PP</span><span style={cel}>DG</span><span style={{textAlign:"right"}}>Pts</span>
        </div>
        {posiciones.map((eq,i)=>(
          <div key={eq.ID_Equipo} className="row-hover fade-in" onClick={()=>onEquipoClick&&onEquipoClick(eq)}
            style={{position:"relative",display:"grid",gridTemplateColumns:cols,gap:3,alignItems:"center",padding:"10px 10px 12px",borderBottom:i<posiciones.length-1?`1px solid ${t.border}`:"none",cursor:onEquipoClick?"pointer":"default",animationDelay:`${i*60}ms`}}>
            {i===0&&<span style={{position:"absolute",left:0,top:10,bottom:10,width:3,borderRadius:"0 3px 3px 0",background:ac}}/>}
            <span style={{fontWeight:700,fontSize:13,color:i===0?ac:t.textMut}}>{i+1}</span>
            <div className="flex items-center gap-2" style={{minWidth:0}}>
              <Shield eq={eq} size={28}/>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:600,fontSize:12.5,color:t.text,lineHeight:1.15,wordBreak:"break-word"}}>{eq.Nombre}</div>
                <div className="flex gap-1 mt-1">
                  {eq.racha.length===0&&<span style={{fontSize:10,color:t.textMut}}>—</span>}
                  {eq.racha.map((r,idx)=>(<span key={idx} title={r} style={{width:8,height:8,borderRadius:"50%",background:r==="G"?"#16A34A":r==="E"?"#F2B705":"#DC2626"}}/>))}
                </div>
              </div>
            </div>
            <span style={{...cel,color:t.textSec}}>{eq.pj}</span>
            <span style={{...cel,color:t.textSec}}>{eq.pg}</span>
            <span style={{...cel,color:t.textSec}}>{eq.pe}</span>
            <span style={{...cel,color:t.textSec}}>{eq.pp}</span>
            <span style={{...cel,color:t.text}}>{eq.dg>0?`+${eq.dg}`:eq.dg}</span>
            <span style={{textAlign:"right",fontWeight:800,fontSize:16,color:ac}}>{eq.pts}</span>
            <span className="bar-grow" style={{position:"absolute",left:12,right:12,bottom:4,height:2,borderRadius:2,background:`linear-gradient(90deg,${ac},${ac}00)`,transform:`scaleX(${eq.pts/maxP})`,opacity:.55}}/>
          </div>
        ))}
      </div>
    </div>
  )}

// ============ VISTA TABLA ============
function VistaTabla({equipos,jugadoras,partidos,config,isDark}){
  const t=useTheme();const ea=Number(config.EtapaActual)||1;
  const[em,setEm]=useState(null);
  const mp=config.MostrarPlantel!=="NO";
  const p1=partidos.filter(p=>Number(p.Etapa)===1);
  const p2=partidos.filter(p=>Number(p.Etapa)===2);
  const pV=useMemo(()=>calcPos(equipos.filter(e=>e.Zona==="Verde"),p1,config),[equipos,partidos,config]);
  const pR=useMemo(()=>calcPos(equipos.filter(e=>e.Zona==="Roja"),p1,config),[equipos,partidos,config]);
  const pO=useMemo(()=>calcPos(equipos.filter(e=>e.Liga==="Oro"),p2,config),[equipos,partidos,config]);
  const pP=useMemo(()=>calcPos(equipos.filter(e=>e.Liga==="Plata"),p2,config),[equipos,partidos,config]);
  const h2=ea>=2&&(pO.length>0||pP.length>0);
  return(
    <div className="px-4 pb-6 pt-3 fade-in">
      {h2&&<div className="mb-4">
        <Sec><span style={{color:ACCENT}}>●</span> FASE 2 — ZONAS</Sec>
        {pO.length>0&&<TablaGrupo tema="Oro" posiciones={pO} onEquipoClick={mp?setEm:null} isDark={isDark}/>}
        {pP.length>0&&<TablaGrupo tema="Plata" posiciones={pP} onEquipoClick={mp?setEm:null} isDark={isDark}/>}
      </div>}
      {!(ea>=2&&config.MostrarTablaFase1==="NO")&&<div>
        <Sec><span style={{color:ea>=2?t.textMut:ACCENT}}>●</span> {ea>=2?"FASE 1 — FINALIZADA":"FASE 1 — CLASIFICACIÓN"}</Sec>
        {pV.length>0&&<TablaGrupo tema="Verde" posiciones={pV} onEquipoClick={mp?setEm:null} isDark={isDark}/>}
        {pR.length>0&&<TablaGrupo tema="Roja" posiciones={pR} onEquipoClick={mp?setEm:null} isDark={isDark}/>}
      </div>}
      <p className="text-xs mt-3 px-1" style={{color:t.textMut,fontFamily:F_B}}>
        {mp&&"Tocá un equipo para ver su plantel. "}<strong>Forma</strong>: últimos 5, de izquierda a derecha por fecha —
        <span style={{color:"#2E8B57",fontWeight:600}}> G</span> ({config.PuntosVictoria||3}pts),
        <span style={{color:"#F2B705",fontWeight:600}}> E</span> ({config.PuntosEmpate||2}pts),
        <span style={{color:"#A8324A",fontWeight:600}}> P</span> ({config.PuntosDerrota||1}pt).
      </p>
      <ModalEquipo equipo={em} jugadoras={jugadoras} onCerrar={()=>setEm(null)}/>
    </div>
  )}

// ============ MODAL PARTIDO ============
function ModalPartido(props){return (props.partido&&props.partido.Jugado==="SI")?<Portal><ModalPartidoInner {...props}/></Portal>:null}
function ModalPartidoInner({partido,equipos,jugadoras,goles,onCerrar}){
  const t=useTheme();if(!partido||partido.Jugado!=="SI")return null;
  const lo=equipoPorId(equipos,partido.ID_EquipoLocal);const vi=equipoPorId(equipos,partido.ID_EquipoVisitante);
  const gp=(goles||[]).filter(g=>String(g.ID_Partido).toLowerCase()===String(partido.ID_Partido).toLowerCase());
  const cd=gp.map(g=>{const j=(jugadoras||[]).find(x=>(x.ID_Jugadora||"").toLowerCase()===(g.ID_Jugadora||"").toLowerCase());return{...g,nombre:j?j.Nombre:g.ID_Jugadora,idEquipo:j?j.ID_Equipo:""}}).filter(g=>Number(g.Cantidad_Goles)>0);
  const gL=cd.filter(g=>(g.idEquipo||"").toLowerCase()===(partido.ID_EquipoLocal||"").toLowerCase()).sort((a,b)=>Number(b.Cantidad_Goles)-Number(a.Cantidad_Goles));
  const gV=cd.filter(g=>(g.idEquipo||"").toLowerCase()===(partido.ID_EquipoVisitante||"").toLowerCase()).sort((a,b)=>Number(b.Cantidad_Goles)-Number(a.Cantidad_Goles));
  const mvp=(()=>{if(!partido.MVP_Partido)return null;const j=(jugadoras||[]).find(x=>(x.ID_Jugadora||"").toLowerCase()===String(partido.MVP_Partido).toLowerCase());return j?j.Nombre:null})();
  const Lista=({lista,equipo})=>(
    <div style={{flex:1,minWidth:0}}>
      <div className="flex items-center gap-1.5 mb-2"><span className="text-[11px] font-bold uppercase" style={{color:t.textMut,letterSpacing:".06em"}}>{equipo.Nombre}</span></div>
      {lista.length===0&&<p className="text-[11px]" style={{color:t.textMut}}>Sin goles</p>}

// ============ VISTA FIXTURE ============
function VistaFixture({equipos,jugadoras,partidos,goles,config,isDark}){
  const t=useTheme();const ea=Number(config.EtapaActual)||1;
  const ocultaF1=ea>=2&&config.MostrarFixtureFase1==="NO";
  const[ev,setEv]=useState(ea);const[gv,setGv]=useState(ea>=2?"Oro":"Verde");
  const[pd,setPd]=useState(null);
  // Sincronizar cuando cambia la config
  useEffect(()=>{const nea=Number(config.EtapaActual)||1;setEv(nea);setGv(nea>=2?"Oro":"Verde")},[config.EtapaActual]);
  // Si la Fase 1 está oculta, nunca se muestra aunque quede seleccionada
  const evEf=(ocultaF1&&ev===1)?ea:ev;
  const gd=evEf===1?["Verde","Roja"]:["Oro","Plata"];
  const gz=gd.includes(gv)?gv:gd[0];
  const ce=e=>{setEv(e);setGv(e===1?"Verde":"Oro")};
  const pf=partidos.filter(p=>{if(Number(p.Etapa)!==evEf)return false;const l=equipoPorId(equipos,p.ID_EquipoLocal);return evEf===1?l.Zona===gz:l.Liga===gz});
  const jn=[...new Set(pf.map(p=>p.Jornada))].sort((a,b)=>a-b);
  const z=TEMA[gz]||TEMA.Verde;
  const bMvp=mid=>{if(!mid)return null;const j=(jugadoras||[]).find(x=>(x.ID_Jugadora||"").toLowerCase()===String(mid).toLowerCase());if(!j)return null;return{nombre:j.Nombre,equipo:equipoPorId(equipos,j.ID_Equipo).Nombre}};
  return(
    <div className="px-4 pb-6 pt-3 fade-in">
      {!ocultaF1&&<div className="flex gap-2 mb-2">
        <Chip grow on={ev===1} onClick={()=>ce(1)}>Fase 1 — Zonas</Chip>
        {ea>=2&&<Chip grow on={ev===2} onClick={()=>ce(2)}>Fase 2 — Zonas</Chip>}
      </div>}
      <div className="flex gap-2 mb-3">
        {gd.map(g=>{const tz=TEMA[g];return <Chip key={g} grow on={gz===g} dot={isDark?tz.acDark:tz.ac} onClick={()=>setGv(g)}>{tz.label}</Chip>})}
      </div>
      {jn.length===0&&<p className="text-sm text-center py-4" style={{fontFamily:F_B,color:t.textMut}}>No hay partidos en esta zona.</p>}
      <div>
        {jn.map(j=>(
          <div key={j} className="fade-in mb-5">
            <div className="flex items-center justify-between px-1 mb-2">
              <span className="text-[11px] font-bold uppercase" style={{letterSpacing:".1em",color:t.textMut}}>FECHA {j}</span>
              <span style={{width:8,height:8,borderRadius:99,background:isDark?z.acDark:z.ac}}/>
            </div>
            <div className="space-y-2.5">
              {pf.filter(p=>p.Jornada===j).sort((a,b)=>String(a.Fecha).slice(0,10).localeCompare(String(b.Fecha).slice(0,10))||minutosHora(a.Hora)-minutosHora(b.Hora)).map((p,ix)=>{
                const lo=equipoPorId(equipos,p.ID_EquipoLocal);const vi=equipoPorId(equipos,p.ID_EquipoVisitante);const mvp=p.Jugado==="SI"?bMvp(p.MVP_Partido):null;
                const jug=p.Jugado==="SI";const hora=String(p.Hora||"");
                return(
                  <div key={p.ID_Partido} className={`rounded-2xl px-3 py-3 lift fade-in ${jug?"cursor-pointer":""}`} onClick={()=>jug&&setPd(p)} style={{background:t.card,border:`1px solid ${t.border}`,boxShadow:`0 8px 24px -12px ${t.shadow}`,animationDelay:`${ix*60}ms`}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",alignItems:"center",gap:6}}>
                      <div className="flex flex-col items-center gap-1.5 text-center" style={{minWidth:0}}><Shield eq={lo} size={38}/><span style={{fontSize:12,fontWeight:600,color:t.text,lineHeight:1.15}}>{lo.Nombre}</span></div>
                      <div style={{textAlign:"center",minWidth:78}}>
                        {jug?(<div style={{fontSize:24,fontWeight:800,letterSpacing:"-.02em"}}>
                          <span style={{color:Number(p.GolesLocal)>Number(p.GolesVisitante)?"#16A34A":t.text}}>{p.GolesLocal}</span>
                          <span style={{color:t.textMut,fontWeight:500,margin:"0 4px"}}>–</span>
                          <span style={{color:Number(p.GolesVisitante)>Number(p.GolesLocal)?"#16A34A":t.text}}>{p.GolesVisitante}</span>
                        </div>):(<div style={{fontSize:hora.length>8?11:15,fontWeight:700,color:t.text,lineHeight:1.2}}>{hora||"A definir"}</div>)}
                        <div className="mt-1"><span style={{display:"inline-block",fontSize:9.5,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",padding:"3px 8px",borderRadius:999,background:jug?t.cardAlt:(isDark?z.bg+"55":z.bgL),color:jug?t.textMut:(isDark?z.acDark:z.ac)}}>{jug?"Finalizado":"Pendiente"}</span></div>
                      </div>
                      <div className="flex flex-col items-center gap-1.5 text-center" style={{minWidth:0}}><Shield eq={vi} size={38}/><span style={{fontSize:12,fontWeight:600,color:t.text,lineHeight:1.15}}>{vi.Nombre}</span></div>
                    </div>
                    <div className="flex items-center justify-center gap-2 flex-wrap mt-3 pt-2.5" style={{borderTop:`1px dashed ${t.border}`,fontSize:11,color:t.textMut}}>
                      <span>{fechaCorta(p.Fecha)}</span>{p.Cancha&&<span>· {p.Cancha}</span>}
                      {mvp&&<span style={{color:ACCENT,fontWeight:600}}>· ⭐ {mvp.nombre}</span>}
                    </div>
                  </div>
                )})}
            </div>
          </div>
        ))}
      </div>
      <ModalPartido partido={pd} equipos={equipos} jugadoras={jugadoras} goles={goles} onCerrar={()=>setPd(null)}/>
    </div>)}

// ============ VISTA GOLEADORAS ============
function VistaGoleadoras({goles,jugadoras,partidos,equipos,config,isDark}){
  const t=useTheme();const ea=Number(config.EtapaActual)||1;
  const ocultaF1=config.MostrarGoleadorasFase1==="NO";
  const[faseSel,setFaseSel]=useState(null);
  const[gv,setGv]=useState(null);
  // Fase a mostrar: la elegida, o la actual. Si la Fase 1 está oculta, siempre la actual.
  let fase=faseSel??ea;if(fase>ea)fase=ea;if(fase===1&&ea>=2&&ocultaF1)fase=ea;
  const mostrarBtnFase=ea>=2&&!ocultaF1;
  const gd=fase===1?["Verde","Roja"]:["Oro","Plata"];
  const gz=gd.includes(gv)?gv:gd[0];

  // Partidos jugados de ESTA fase (por ID) -> solo sus goles cuentan
  const faseDe={};(partidos||[]).forEach(p=>{if(p.Jugado==="SI")faseDe[String(p.ID_Partido).toLowerCase()]=Number(p.Etapa)||1});
  const tot={};
  (goles||[]).forEach(g=>{
    if(faseDe[String(g.ID_Partido).toLowerCase()]!==fase)return;
    const n=Number(g.Cantidad_Goles)||0;if(n<=0)return;
    const jid=String(g.ID_Jugadora).toLowerCase();tot[jid]=(tot[jid]||0)+n});
  const lista=Object.entries(tot).map(([jid,n])=>{
    const j=(jugadoras||[]).find(x=>String(x.ID_Jugadora).toLowerCase()===jid);if(!j)return null;
    const eq=(equipos||[]).find(e=>String(e.ID_Equipo).toLowerCase()===String(j.ID_Equipo).toLowerCase());if(!eq)return null;
    return{ID_Jugadora:j.ID_Jugadora,Nombre:j.Nombre,Equipo:eq.Nombre,zona:fase===1?eq.Zona:eq.Liga,Goles_Totales:n}}).filter(Boolean);
  const rk=lista.filter(x=>x.zona===gz).sort((a,b)=>b.Goles_Totales-a.Goles_Totales||(a.Nombre||"").localeCompare(b.Nombre||""));
  const mx=rk[0]?.Goles_Totales||1;
  // MVP: también se cuentan solo los de esta fase
  const mc={};(partidos||[]).forEach(p=>{if(p.Jugado==="SI"&&p.MVP_Partido&&(Number(p.Etapa)||1)===fase){const id=String(p.MVP_Partido).toUpperCase();mc[id]=(mc[id]||0)+1}});
  const bF=id=>{const j=(jugadoras||[]).find(x=>(x.ID_Jugadora||"").toLowerCase()===(id||"").toLowerCase());return j?fotoDrive(j.Foto_URL):null};
  const medals=["#FFD700","#C0C0C0","#CD7F32"];

  const Controles=()=>(
    <div>
      {mostrarBtnFase&&<div className="flex gap-2 mb-2">
        {[1,2].map(f=>(<Chip key={f} grow on={fase===f} onClick={()=>{setFaseSel(f);setGv(null)}}>{f===1?"Fase 1 — Archivo":"Fase 2 — Actual"}</Chip>))}
      </div>}
      <div className="flex gap-2 mb-4">
        {gd.map(g=>{const z=TEMA[g];return <Chip key={g} grow on={gz===g} dot={isDark?z.acDark:z.ac} onClick={()=>setGv(g)}>{z.label}</Chip>})}
      </div>
    </div>);

  if(rk.length===0)return(<div className="px-4 pb-6 pt-3 fade-in"><Controles/><p className="text-sm text-center py-4" style={{fontFamily:F_B,color:t.textMut}}>Todavía no hay goles registrados en esta zona{ea>=2&&fase===2?" en la Fase 2":""}.</p></div>);
  const podio=rk.length>=3;const resto=podio?rk.slice(3):rk;const off=podio?3:0;
  const Av=({g,size,ring})=>{const f=bF(g.ID_Jugadora);return f?<img src={f} alt="" style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:`3px solid ${ring}`,margin:"0 auto"}}/>:<div style={{width:size,height:size,borderRadius:"50%",display:"grid",placeItems:"center",margin:"0 auto",background:`linear-gradient(135deg,${ACCENT},${ACCENT_DARK})`,color:"#FFF",fontWeight:800,fontSize:size*0.32,border:`3px solid ${ring}`}}>{ini(g.Nombre)}</div>};
  const Pod=({g,i})=>{const first=i===0;const mv=mc[String(g.ID_Jugadora).toUpperCase()]||0;return(
    <div className="fade-in" style={{borderRadius:20,textAlign:"center",padding:first?"18px 6px":"14px 6px",background:first?`linear-gradient(160deg,${ACCENT},${ACCENT_DARK})`:t.card,color:first?"#FFF":t.text,border:first?"none":`1px solid ${t.border}`,boxShadow:`0 10px 26px -12px ${first?ACCENT+"88":t.shadow}`,animationDelay:`${[1,0,2][i]*90}ms`}}>
      <div style={{fontSize:18}}>{["🥇","🥈","🥉"][i]}</div>
      <div style={{margin:"6px 0"}}><Av g={g} size={first?62:50} ring={first?"rgba(255,255,255,.55)":t.card}/></div>
      <div style={{fontSize:12,fontWeight:700,lineHeight:1.15,padding:"0 2px"}}>{g.Nombre}</div>
      <div style={{fontSize:10.5,opacity:.7,marginTop:2}}>{g.Equipo}</div>
      <div style={{fontSize:24,fontWeight:800,marginTop:6}}>{g.Goles_Totales}</div>
      {mv>0&&<div style={{fontSize:10,marginTop:2}}>{"🏆".repeat(Math.min(mv,3))}{mv>3?`+${mv-3}`:""}</div>}
    </div>)};
  return(
    <div className="px-4 pb-6 pt-3 fade-in"><Controles/>
      {podio&&<div style={{display:"grid",gridTemplateColumns:"1fr 1.15fr 1fr",gap:8,alignItems:"end",marginBottom:14}}>
        <Pod g={rk[1]} i={1}/><Pod g={rk[0]} i={0}/><Pod g={rk[2]} i={2}/>
      </div>}
      {resto.length>0&&<div className="rounded-2xl overflow-hidden" style={{background:t.card,border:`1px solid ${t.border}`,boxShadow:`0 8px 24px -10px ${t.shadow}`}}>
        {resto.map((g,k)=>{const i=k+off;const mvps=mc[String(g.ID_Jugadora).toUpperCase()]||0;return(
          <div key={g.ID_Jugadora||g.Nombre} className="row-hover fade-in flex items-center gap-3" style={{padding:"11px 14px",borderBottom:k<resto.length-1?`1px solid ${t.border}`:"none",animationDelay:`${k*50}ms`}}>
            <span style={{width:20,fontWeight:700,fontSize:13,color:t.textMut}}>{i+1}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:600,color:t.text}}>{g.Nombre}{mvps>0&&<span style={{marginLeft:6,fontSize:11}}>{"🏆".repeat(Math.min(mvps,5))}{mvps>5?`+${mvps-5}`:""}</span>}</div>
              <div style={{fontSize:11,color:t.textMut}}>{g.Equipo}</div>
              <div style={{height:3,borderRadius:3,background:t.border,marginTop:6,overflow:"hidden"}}><div className="bar-grow" style={{height:"100%",width:`${(g.Goles_Totales/mx)*100}%`,background:`linear-gradient(90deg,${ACCENT},#FF7AB8)`,borderRadius:3}}/></div>
            </div>
            <span style={{fontSize:20,fontWeight:800,color:ACCENT}}>{g.Goles_Totales}</span>
          </div>)})}
      </div>}
      <p className="text-xs mt-3 px-1" style={{color:t.textMut,fontFamily:F_B}}>🏆 = MVP de partido</p>
    </div>)}

          {cargando&&<Skeleton/>}
          {!cargando&&tab==="tabla"&&<VistaTabla equipos={equipos} jugadoras={jugadoras} partidos={partidos} config={config} isDark={dark}/>}
          {!cargando&&tab==="fixture"&&<VistaFixture equipos={equipos} jugadoras={jugadoras} partidos={partidos} goles={goles} config={config} isDark={dark}/>}
          {!cargando&&tab==="goleadoras"&&<VistaGoleadoras goles={goles} jugadoras={jugadoras} partidos={partidos} equipos={equipos} config={config} isDark={dark}/>}
          {!cargando&&tab==="noticias"&&<VistaNoticias noticias={noticias} onAbrir={setNa}/>}
        </div>

        {/* FOOTER */}
        <div className="px-4 py-5 text-center" style={{fontFamily:F_B}}>
          <a href="https://drive.google.com/file/d/1TUIb93cEgvbQSl1l4mTAaQi6tN5jSkmB/view" target="_blank" rel="noopener noreferrer"
            className="inline-block text-[11px] px-4 py-2.5 rounded-xl btn-press" style={{background:theme.card,color:theme.text,border:`1px solid ${theme.border}`,fontWeight:700,letterSpacing:".06em",textDecoration:"none",boxShadow:`0 6px 18px -10px ${theme.shadow}`}}>
            📋 VER REGLAMENTO
          </a>
          {config.SponsorVisible==="SI"&&config.SponsorURL&&(
            <div className="mt-4"><a href={config.SponsorLink||"#"} target="_blank" rel="noopener noreferrer">
              <img src={config.SponsorURL} alt="Sponsor" className="mx-auto rounded-xl" style={{maxHeight:60,maxWidth:"100%",objectFit:"contain"}}/>
            </a></div>)}
          <span className="text-[10px] block mt-4" style={{color:theme.textMut,letterSpacing:".04em"}}>SITAS · Sociedad Italiana de Tiro al Blanco</span>
        </div>
      </div>
      <ModalNoticia noticia={na} onCerrar={()=>setNa(null)}/>
    </div>
    </ThemeCtx.Provider>)}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("service-worker.js").catch(()=>{})})}</script>
</body>
</html>
