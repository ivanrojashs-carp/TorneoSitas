<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin · Liga Femenina de Handball</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body { margin: 0; background: #E5E1D6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .girando { animation: spin 1s linear infinite; display: inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // Mismo helper JSONP que en index.html — ver comentario allá.
    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const nombreCallback = "cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        window[nombreCallback] = (datos) => {
          resolve(datos);
          delete window[nombreCallback];
          script.remove();
        };
        script.onerror = () => {
          reject(new Error("No se pudo conectar con la API"));
          delete window[nombreCallback];
          script.remove();
        };
        const separador = url.includes("?") ? "&" : "?";
        script.src = url + separador + "callback=" + nombreCallback + "&_ts=" + Date.now();
        document.body.appendChild(script);
      });
    }

    const EQUIPOS_DEMO = [
      { ID_Equipo: "E01", Nombre: "Las Águilas" }, { ID_Equipo: "E02", Nombre: "Cóndor HC" },
      { ID_Equipo: "E03", Nombre: "Tormenta Sur" }, { ID_Equipo: "E04", Nombre: "Vendaval" },
    ];
    const JUGADORAS_DEMO = [
      { ID_Jugadora: "J01", ID_Equipo: "E01", Nombre: "Camila Ríos" },
      { ID_Jugadora: "J02", ID_Equipo: "E02", Nombre: "Martina Sosa" },
      { ID_Jugadora: "J03", ID_Equipo: "E03", Nombre: "Sol Medina" },
      { ID_Jugadora: "J04", ID_Equipo: "E04", Nombre: "Ailén Castro" },
    ];
    const PARTIDOS_DEMO = [
      { ID_Partido: "P02", Jornada: 1, ID_EquipoLocal: "E03", ID_EquipoVisitante: "E04", Jugado: "NO" },
    ];

    const TABS = [
      { key: "resultados", label: "Resultados", icon: "✅" },
      { key: "fixture", label: "Fixture", icon: "📅" },
      { key: "goleo", label: "Goles", icon: "🎯" },
      { key: "jugadoras", label: "Plantel", icon: "🪪" },
      { key: "noticias", label: "Noticias", icon: "📰" },
      { key: "config", label: "Config", icon: "🔧" },
    ];

    const C = { ink: "#12203B", paper: "#F6F3EC", coral: "#E84C3D", gold: "#F2B705", teal: "#1B6B6B", line: "#E5E1D6", muted: "#6B7280" };
    const F_DISPLAY = "Oswald, sans-serif";
    const F_BODY = "Inter, sans-serif";

    const estiloInput = { width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFF", fontFamily: F_BODY, fontSize: 14, color: C.ink };

    function Campo({ label, children }) {
      return <label className="block mb-3"><span className="block text-xs mb-1" style={{ fontFamily: F_BODY, color: C.muted }}>{label}</span>{children}</label>;
    }

    function BotonGuardar({ cargando, children }) {
      return (
        <button type="submit" disabled={cargando} className="w-full flex items-center justify-center gap-2 rounded-lg py-2.5 mt-1"
          style={{ background: C.ink, color: C.gold, fontFamily: F_BODY, fontWeight: 600, opacity: cargando ? 0.7 : 1 }}>
          {cargando ? <span className="girando">⏳</span> : "💾"} {children}
        </button>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      const ok = toast.tipo === "ok";
      return (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg flex items-center gap-2 z-50"
          style={{ background: ok ? C.teal : C.coral, color: "#FFF", fontFamily: F_BODY, fontSize: 13, maxWidth: "90%" }}>
          {ok ? "✅" : "❌"} {toast.mensaje}
        </div>
      );
    }

    function ModalConfig({ abierto, onCerrar, apiUrl, setApiUrl, token, setToken, estadoConexion, onProbar }) {
      if (!abierto) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(18,32,59,0.55)" }} onClick={onCerrar}>
          <div className="w-full max-w-sm rounded-t-2xl p-5" style={{ background: "#FFF" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h3 style={{ fontFamily: F_DISPLAY, fontWeight: 700, color: C.ink, fontSize: 18 }}>CONEXIÓN</h3>
              <button onClick={onCerrar} style={{ color: C.muted }}>✕</button>
            </div>
            <Campo label="URL de Apps Script (termina en /exec)">
              <input style={estiloInput} value={apiUrl} onChange={(e) => setApiUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
            </Campo>
            <Campo label="Token de administrador">
              <input style={estiloInput} type="password" value={token} onChange={(e) => setToken(e.target.value)} placeholder="el mismo que pusiste en ADMIN_TOKEN" />
            </Campo>
            <div className="flex items-center gap-2 mb-3 text-xs" style={{ fontFamily: F_BODY }}>
              {estadoConexion === "ok" && <span style={{ color: C.teal }}>✅ Conectado</span>}
              {estadoConexion === "error" && <span style={{ color: C.coral }}>❌ No se pudo conectar</span>}
              {estadoConexion === "demo" && <span style={{ color: C.muted }}>Modo demo — los cambios no se guardan en el Sheet</span>}
            </div>
            <button onClick={onProbar} className="w-full rounded-lg py-2.5" style={{ background: C.paper, color: C.ink, fontFamily: F_BODY, fontWeight: 600, border: `1px solid ${C.line}` }}>
              Probar conexión
            </button>
            <p className="text-[11px] mt-3" style={{ color: C.muted, fontFamily: F_BODY }}>
              La URL y el token quedan guardados en este navegador (localStorage), no hace falta pegarlos cada vez.
            </p>
          </div>
        </div>
      );
    }

    function VistaResultados({ partidos, equipos, jugadoras, onGuardar, cargando }) {
      const pendientes = partidos.filter((p) => p.Jugado !== "SI");
      const [idPartido, setIdPartido] = useState(pendientes[0]?.ID_Partido || "");
      const [golesLocal, setGolesLocal] = useState("");
      const [golesVisitante, setGolesVisitante] = useState("");
      const [mvp, setMvp] = useState("");
      const partido = partidos.find((p) => p.ID_Partido === idPartido);
      const nombre = (id) => equipos.find((e) => e.ID_Equipo === id)?.Nombre || id;
      const disponibles = partido ? jugadoras.filter((j) => (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoLocal || "").toLowerCase() || (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoVisitante || "").toLowerCase()) : [];

      if (pendientes.length === 0) return <p className="px-4 py-6 text-sm" style={{ fontFamily: F_BODY, color: C.muted }}>No quedan partidos pendientes.</p>;

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ idPartido, golesLocal: Number(golesLocal), golesVisitante: Number(golesVisitante), mvp }, () => { setGolesLocal(""); setGolesVisitante(""); setMvp(""); }); }}>
          <Campo label="Partido pendiente">
            <select style={estiloInput} value={idPartido} onChange={(e) => setIdPartido(e.target.value)}>
              {pendientes.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>Fecha {p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
            </select>
          </Campo>
          <div className="flex gap-3">
            <Campo label={`Goles ${partido ? nombre(partido.ID_EquipoLocal) : "local"}`}><input style={estiloInput} type="number" min="0" value={golesLocal} onChange={(e) => setGolesLocal(e.target.value)} required /></Campo>
            <Campo label={`Goles ${partido ? nombre(partido.ID_EquipoVisitante) : "visitante"}`}><input style={estiloInput} type="number" min="0" value={golesVisitante} onChange={(e) => setGolesVisitante(e.target.value)} required /></Campo>
          </div>
          <Campo label="MVP del partido (opcional)">
            <select style={estiloInput} value={mvp} onChange={(e) => setMvp(e.target.value)}>
              <option value="">Sin elegir</option>
              {disponibles.map((j) => <option key={j.ID_Jugadora} value={j.ID_Jugadora}>{j.Nombre}</option>)}
            </select>
          </Campo>
          <BotonGuardar cargando={cargando}>Cargar resultado</BotonGuardar>
        </form>
      );
    }

    function VistaFixture({ equipos, onGuardar, cargando }) {
      const [jornada, setJornada] = useState("");
      const [fecha, setFecha] = useState("");
      const [hora, setHora] = useState("");
      const [cancha, setCancha] = useState("");
      const [idLocal, setIdLocal] = useState(equipos[0]?.ID_Equipo || "");
      const [idVisitante, setIdVisitante] = useState(equipos[1]?.ID_Equipo || "");

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); if (idLocal === idVisitante) return; onGuardar({ jornada: Number(jornada), fecha, hora, cancha, idLocal, idVisitante }, () => { setJornada(""); setFecha(""); setHora(""); setCancha(""); }); }}>
          <Campo label="Fecha de torneo (jornada)"><input style={estiloInput} type="number" min="1" value={jornada} onChange={(e) => setJornada(e.target.value)} required /></Campo>
          <div className="flex gap-3">
            <Campo label="Fecha calendario"><input style={estiloInput} type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} required /></Campo>
            <Campo label="Hora"><input style={estiloInput} type="time" value={hora} onChange={(e) => setHora(e.target.value)} required /></Campo>
          </div>
          <Campo label="Cancha"><input style={estiloInput} value={cancha} onChange={(e) => setCancha(e.target.value)} placeholder="Cancha 1" required /></Campo>
          <div className="flex gap-3">
            <Campo label="Equipo local"><select style={estiloInput} value={idLocal} onChange={(e) => setIdLocal(e.target.value)}>{equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}</select></Campo>
            <Campo label="Equipo visitante"><select style={estiloInput} value={idVisitante} onChange={(e) => setIdVisitante(e.target.value)}>{equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}</select></Campo>
          </div>
          {idLocal === idVisitante && <p className="text-xs mb-2" style={{ color: C.coral, fontFamily: F_BODY }}>Un equipo no puede jugar contra sí mismo.</p>}
          <BotonGuardar cargando={cargando}>Agregar partido</BotonGuardar>
        </form>
      );
    }

    function VistaGoleo({ partidos, jugadoras, equipos, onGuardar, cargando }) {
      const jugados = partidos.filter((p) => p.Jugado === "SI");
      const [idPartido, setIdPartido] = useState(jugados[0]?.ID_Partido || "");
      const [idJugadora, setIdJugadora] = useState("");
      const [cantidad, setCantidad] = useState("");
      const partido = partidos.find((p) => p.ID_Partido === idPartido);
      const nombre = (id) => equipos.find((e) => e.ID_Equipo === id)?.Nombre || id;
      const disponibles = partido ? jugadoras.filter((j) => (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoLocal || "").toLowerCase() || (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoVisitante || "").toLowerCase()) : [];

      if (jugados.length === 0) return <p className="px-4 py-6 text-sm" style={{ fontFamily: F_BODY, color: C.muted }}>Todavía no hay partidos jugados.</p>;

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ idPartido, idJugadora, cantidad: Number(cantidad) }, () => setCantidad("")); }}>
          <Campo label="Partido jugado">
            <select style={estiloInput} value={idPartido} onChange={(e) => { setIdPartido(e.target.value); setIdJugadora(""); }}>
              {jugados.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>Fecha {p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
            </select>
          </Campo>
          <Campo label="Jugadora">
            <select style={estiloInput} value={idJugadora} onChange={(e) => setIdJugadora(e.target.value)} required>
              <option value="">Elegir...</option>
              {disponibles.map((j) => <option key={j.ID_Jugadora} value={j.ID_Jugadora}>{j.Nombre}</option>)}
            </select>
          </Campo>
          <Campo label="Goles convertidos en este partido"><input style={estiloInput} type="number" min="0" value={cantidad} onChange={(e) => setCantidad(e.target.value)} required /></Campo>
          <BotonGuardar cargando={cargando}>Registrar goles</BotonGuardar>
        </form>
      );
    }

    function VistaNoticias({ onGuardar, cargando }) {
      const [titulo, setTitulo] = useState("");
      const [texto, setTexto] = useState("");
      const [imagenUrl, setImagenUrl] = useState("");
      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ titulo, texto, imagenUrl, publicada: true }, () => { setTitulo(""); setTexto(""); setImagenUrl(""); }); }}>
          <Campo label="Título"><input style={estiloInput} value={titulo} onChange={(e) => setTitulo(e.target.value)} required /></Campo>
          <Campo label="Texto"><textarea style={{ ...estiloInput, minHeight: 80, resize: "vertical" }} value={texto} onChange={(e) => setTexto(e.target.value)} required /></Campo>
          <Campo label="URL de imagen (opcional)"><input style={estiloInput} value={imagenUrl} onChange={(e) => setImagenUrl(e.target.value)} placeholder="https://..." /></Campo>
          <BotonGuardar cargando={cargando}>➕ Publicar noticia</BotonGuardar>
        </form>
      );
    }

    function VistaJugadoras({ jugadoras, equipos }) {
      const [busqueda, setBusqueda] = useState("");
      const [equipoFiltro, setEquipoFiltro] = useState("");

      const resultados = jugadoras.filter((j) => {
        const matchTexto = !busqueda || 
          (j.Nombre || "").toLowerCase().includes(busqueda.toLowerCase()) ||
          (j.DNI || "").replace(/\./g, "").includes(busqueda.replace(/\./g, ""));
        const matchEquipo = !equipoFiltro || (j.ID_Equipo || "").toLowerCase() === equipoFiltro.toLowerCase();
        return matchTexto && matchEquipo;
      });

      const nombreEquipo = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;

      return (
        <div className="px-4 pb-6">
          <p className="text-xs mb-3" style={{ fontFamily: F_BODY, color: C.muted }}>
            Consultá DNI y fecha de nacimiento para verificar identidad antes del partido.
          </p>
          <Campo label="Buscar por nombre o DNI">
            <input style={estiloInput} value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Nombre o número de DNI..." />
          </Campo>
          <Campo label="Filtrar por equipo">
            <select style={estiloInput} value={equipoFiltro} onChange={(e) => setEquipoFiltro(e.target.value)}>
              <option value="">Todos los equipos</option>
              {equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}
            </select>
          </Campo>

          <div className="text-xs mb-2" style={{ fontFamily: F_BODY, color: C.muted }}>
            {resultados.length} jugadora{resultados.length !== 1 ? "s" : ""}
          </div>

          <div className="space-y-2" style={{ maxHeight: 400, overflowY: "auto" }}>
            {resultados.map((j) => (
              <div key={j.ID_Jugadora} className="rounded-xl px-4 py-3" style={{ background: "#FFF", border: `1px solid ${C.line}` }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-sm font-medium" style={{ fontFamily: F_BODY, color: C.ink }}>{j.Nombre}</span>
                  <span className="text-xs px-2 py-0.5 rounded" style={{ background: "#F0F0F0", color: C.muted, fontFamily: F_BODY }}>#{j.Dorsal}</span>
                </div>
                <div className="text-xs" style={{ fontFamily: F_BODY, color: C.muted }}>
                  {nombreEquipo(j.ID_Equipo)}
                </div>
                <div className="flex gap-4 mt-1.5">
                  <div className="text-xs" style={{ fontFamily: F_BODY }}>
                    <span style={{ color: C.muted }}>DNI: </span>
                    <span style={{ color: C.ink, fontWeight: 600 }}>{j.DNI || "—"}</span>
                  </div>
                  <div className="text-xs" style={{ fontFamily: F_BODY }}>
                    <span style={{ color: C.muted }}>Nac: </span>
                    <span style={{ color: C.ink, fontWeight: 600 }}>{j.Fecha_Nacimiento ? String(j.Fecha_Nacimiento).slice(0, 10) : "—"}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function VistaConfig({ config, onGuardar, cargando }) {
      const [puntosVictoria, setPuntosVictoria] = useState(config.puntosVictoria ?? 2);
      const [puntosEmpate, setPuntosEmpate] = useState(config.puntosEmpate ?? 1);

      useEffect(() => {
        setPuntosVictoria(config.puntosVictoria ?? 2);
        setPuntosEmpate(config.puntosEmpate ?? 1);
      }, [config.puntosVictoria, config.puntosEmpate]);

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ puntosVictoria: Number(puntosVictoria), puntosEmpate: Number(puntosEmpate) }); }}>
          <p className="text-xs mb-3" style={{ fontFamily: F_BODY, color: C.muted }}>
            Define cuántos puntos suma cada equipo por victoria y por empate. La tabla de posiciones se recalcula sola apenas guardás.
          </p>
          <div className="flex gap-3">
            <Campo label="Puntos por victoria"><input style={estiloInput} type="number" min="0" value={puntosVictoria} onChange={(e) => setPuntosVictoria(e.target.value)} required /></Campo>
            <Campo label="Puntos por empate"><input style={estiloInput} type="number" min="0" value={puntosEmpate} onChange={(e) => setPuntosEmpate(e.target.value)} required /></Campo>
          </div>
          <BotonGuardar cargando={cargando}>Guardar puntos</BotonGuardar>
        </form>
      );
    }

    function App() {
      const [tab, setTab] = useState("resultados");
      const [configAbierta, setConfigAbierta] = useState(true);
      const [apiUrl, setApiUrl] = useState(() => localStorage.getItem("admin_apiUrl") || "");
      const [token, setToken] = useState(() => localStorage.getItem("admin_token") || "");
      const [estadoConexion, setEstadoConexion] = useState("demo");
      const [cargando, setCargando] = useState(false);
      const [toast, setToast] = useState(null);

      const [equipos, setEquipos] = useState(EQUIPOS_DEMO);
      const [jugadoras, setJugadoras] = useState(JUGADORAS_DEMO);
      const [partidos, setPartidos] = useState(PARTIDOS_DEMO);
      const [config, setConfig] = useState({ puntosVictoria: 2, puntosEmpate: 1 });

      useEffect(() => { localStorage.setItem("admin_apiUrl", apiUrl); }, [apiUrl]);
      useEffect(() => { localStorage.setItem("admin_token", token); }, [token]);
      useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); }, [toast]);

      async function cargarDatosReales() {
        if (!apiUrl) return;
        try {
          const [eq, ju, pa, cfg] = await Promise.all([
            jsonp(`${apiUrl}?recurso=equipos`),
            jsonp(`${apiUrl}?recurso=jugadoras`),
            jsonp(`${apiUrl}?recurso=partidos`),
            jsonp(`${apiUrl}?recurso=configuracion`),
          ]);
          setEquipos(eq); setJugadoras(ju); setPartidos(pa);
          const porClave = Object.fromEntries((cfg || []).map((c) => [c.Clave, c.Valor]));
          setConfig({ puntosVictoria: porClave.PuntosVictoria ?? 2, puntosEmpate: porClave.PuntosEmpate ?? 1 });
          setEstadoConexion("ok");
        } catch {
          setEstadoConexion("error");
        }
      }

      useEffect(() => { if (apiUrl && token) cargarDatosReales(); }, []);

      async function probarConexion() {
        if (!apiUrl) { setEstadoConexion("demo"); return; }
        await cargarDatosReales();
      }

      async function guardar(accion, payload, alExito) {
        setCargando(true);
        try {
          if (apiUrl && estadoConexion === "ok") {
            const params = new URLSearchParams({ accion, token });
            Object.entries(payload).forEach(([clave, valor]) => {
              if (valor !== undefined && valor !== null) params.set(clave, String(valor));
            });
            const data = await jsonp(`${apiUrl}?${params.toString()}`);
            if (!data.ok) throw new Error(data.error || "Error desconocido");
            setToast({ tipo: "ok", mensaje: data.mensaje || "Guardado" });
            cargarDatosReales();
          } else {
            setToast({ tipo: "ok", mensaje: "Guardado en modo demo (no se escribió en el Sheet)" });
          }
          alExito && alExito();
        } catch (err) {
          setToast({ tipo: "error", mensaje: "No se pudo guardar: " + err.message });
        } finally {
          setCargando(false);
        }
      }

      return (
        <div className="min-h-screen flex justify-center" style={{ background: "#E5E1D6" }}>
          <div className="w-full max-w-sm flex flex-col" style={{ background: C.paper, minHeight: "100vh" }}>
            <div className="px-4 pt-5 pb-4 flex items-start justify-between" style={{ background: C.ink }}>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span>🛡️</span>
                  <span className="text-[10px] tracking-[0.2em] uppercase" style={{ color: C.gold, fontFamily: F_BODY }}>Panel admin</span>
                </div>
                <h1 className="text-xl leading-tight" style={{ fontFamily: F_DISPLAY, fontWeight: 700, color: C.paper }}>LIGA FEMENINA<br />DE HANDBALL</h1>
              </div>
              <button onClick={() => setConfigAbierta(true)} className="mt-1" style={{ color: C.paper, fontSize: 20 }}>⚙️</button>
            </div>

            {estadoConexion !== "ok" && (
              <div className="px-4 py-2 text-center text-xs" style={{ background: "#FBEFD2", color: "#8A6300", fontFamily: F_BODY }}>
                Modo demo: los cambios no se guardan en tu Sheet. Tocá ⚙️ para conectar.
              </div>
            )}

            <div className="flex px-4 pt-4 pb-3 gap-1">
              {TABS.map((t) => (
                <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-1 py-2 rounded-lg" style={{ background: tab === t.key ? C.ink : "transparent", color: tab === t.key ? C.gold : C.muted }}>
                  <span>{t.icon}</span>
                  <span className="text-[10px]" style={{ fontFamily: F_BODY, fontWeight: 500 }}>{t.label}</span>
                </button>
              ))}
            </div>

            <div className="flex-1">
              {tab === "resultados" && <VistaResultados partidos={partidos} equipos={equipos} jugadoras={jugadoras} cargando={cargando} onGuardar={(p, cb) => guardar("cargarResultado", p, cb)} />}
              {tab === "fixture" && <VistaFixture equipos={equipos} cargando={cargando} onGuardar={(p, cb) => guardar("agregarPartido", p, cb)} />}
              {tab === "goleo" && <VistaGoleo partidos={partidos} jugadoras={jugadoras} equipos={equipos} cargando={cargando} onGuardar={(p, cb) => guardar("agregarGol", p, cb)} />}
              {tab === "jugadoras" && <VistaJugadoras jugadoras={jugadoras} equipos={equipos} />}
              {tab === "noticias" && <VistaNoticias cargando={cargando} onGuardar={(p, cb) => guardar("agregarNoticia", p, cb)} />}
              {tab === "config" && <VistaConfig config={config} cargando={cargando} onGuardar={(p) => guardar("actualizarConfig", p, () => setConfig(p))} />}
            </div>
          </div>

          <ModalConfig abierto={configAbierta} onCerrar={() => setConfigAbierta(false)} apiUrl={apiUrl} setApiUrl={setApiUrl} token={token} setToken={setToken} estadoConexion={estadoConexion} onProbar={probarConexion} />
          <Toast toast={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
