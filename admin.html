<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin · Liga Femenina de Handball</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body { margin: 0; background: #E5E1D6; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .girando { animation: spin 1s linear infinite; display: inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    // Mismo helper JSONP que en index.html — ver comentario allá.
    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const nombreCallback = "cb_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        window[nombreCallback] = (datos) => {
          resolve(datos);
          delete window[nombreCallback];
          script.remove();
        };
        script.onerror = () => {
          reject(new Error("No se pudo conectar con la API"));
          delete window[nombreCallback];
          script.remove();
        };
        const separador = url.includes("?") ? "&" : "?";
        script.src = url + separador + "callback=" + nombreCallback + "&_ts=" + Date.now();
        document.body.appendChild(script);
      });
    }

    const EQUIPOS_DEMO = [
      { ID_Equipo: "E01", Nombre: "Las Águilas" }, { ID_Equipo: "E02", Nombre: "Cóndor HC" },
      { ID_Equipo: "E03", Nombre: "Tormenta Sur" }, { ID_Equipo: "E04", Nombre: "Vendaval" },
    ];
    const JUGADORAS_DEMO = [
      { ID_Jugadora: "J01", ID_Equipo: "E01", Nombre: "Camila Ríos" },
      { ID_Jugadora: "J02", ID_Equipo: "E02", Nombre: "Martina Sosa" },
      { ID_Jugadora: "J03", ID_Equipo: "E03", Nombre: "Sol Medina" },
      { ID_Jugadora: "J04", ID_Equipo: "E04", Nombre: "Ailén Castro" },
    ];
    const PARTIDOS_DEMO = [
      { ID_Partido: "P02", Jornada: 1, ID_EquipoLocal: "E03", ID_EquipoVisitante: "E04", Jugado: "NO" },
    ];

    const TABS = [
      { key: "resultados", label: "Resultados", icon: "✅" },
      { key: "fixture", label: "Fixture", icon: "📅" },
      { key: "goleo", label: "Goles", icon: "🎯" },
      { key: "control", label: "Control", icon: "🔍" },
      { key: "jugadoras", label: "Plantel", icon: "🪪" },
      { key: "noticias", label: "Noticias", icon: "📰" },
      { key: "config", label: "Config", icon: "🔧" },
    ];

    const C = { ink: "#12203B", paper: "#F6F3EC", coral: "#E84C3D", gold: "#F2B705", teal: "#1B6B6B", line: "#E5E1D6", muted: "#6B7280" };
    const F_DISPLAY = "Oswald, sans-serif";
    const F_BODY = "Inter, sans-serif";

    const estiloInput = { width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFF", fontFamily: F_BODY, fontSize: 14, color: C.ink };

    function Campo({ label, children }) {
      return <label className="block mb-3"><span className="block text-xs mb-1" style={{ fontFamily: F_BODY, color: C.muted }}>{label}</span>{children}</label>;
    }

    function BotonGuardar({ cargando, children }) {
      return (
        <button type="submit" disabled={cargando} className="w-full flex items-center justify-center gap-2 rounded-lg py-2.5 mt-1"
          style={{ background: C.ink, color: C.gold, fontFamily: F_BODY, fontWeight: 600, opacity: cargando ? 0.7 : 1 }}>
          {cargando ? <span className="girando">⏳</span> : "💾"} {children}
        </button>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      const ok = toast.tipo === "ok";
      return (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg flex items-center gap-2 z-50"
          style={{ background: ok ? C.teal : C.coral, color: "#FFF", fontFamily: F_BODY, fontSize: 13, maxWidth: "90%" }}>
          {ok ? "✅" : "❌"} {toast.mensaje}
        </div>
      );
    }

    function ModalConfig({ abierto, onCerrar, apiUrl, setApiUrl, token, setToken, estadoConexion, rol, onProbar }) {
      if (!abierto) return null;
      const rolLabel = { total: "Acceso total", control: "Solo control", carga: "Solo carga" };
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(18,32,59,0.55)" }} onClick={onCerrar}>
          <div className="w-full max-w-sm rounded-t-2xl p-5" style={{ background: "#FFF" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h3 style={{ fontFamily: F_DISPLAY, fontWeight: 700, color: C.ink, fontSize: 18 }}>CONEXIÓN</h3>
              <button onClick={onCerrar} style={{ color: C.muted }}>✕</button>
            </div>
            <Campo label="URL de Apps Script (termina en /exec)">
              <input style={estiloInput} value={apiUrl} onChange={(e) => setApiUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
            </Campo>
            <Campo label="Contraseña de acceso">
              <input style={estiloInput} type="password" value={token} onChange={(e) => setToken(e.target.value)} placeholder="Ingresá tu clave de acceso" />
            </Campo>
            <div className="flex items-center gap-2 mb-3 text-xs" style={{ fontFamily: F_BODY }}>
              {estadoConexion === "ok" && rol && <span style={{ color: C.teal }}>✅ Conectado — {rolLabel[rol] || rol}</span>}
              {estadoConexion === "ok" && !rol && <span style={{ color: C.teal }}>✅ Conectado</span>}
              {estadoConexion === "error" && <span style={{ color: C.coral }}>❌ Token inválido o sin conexión</span>}
              {estadoConexion === "demo" && <span style={{ color: C.muted }}>Ingresá tu clave para conectar</span>}
            </div>
            <button onClick={onProbar} className="w-full rounded-lg py-2.5" style={{ background: C.paper, color: C.ink, fontFamily: F_BODY, fontWeight: 600, border: `1px solid ${C.line}` }}>
              Conectar
            </button>
          </div>
        </div>
      );
    }

    function VistaResultados({ partidos, equipos, jugadoras, onGuardar, cargando }) {
      const pendientes = partidos.filter((p) => p.Jugado !== "SI");
      const [seleccion, setSeleccion] = useState("");
      const [golesLocal, setGolesLocal] = useState("");
      const [golesVisitante, setGolesVisitante] = useState("");
      const [mvp, setMvp] = useState("");

      // ID efectivo: lo que el usuario eligió, o el primero de la lista
      const idEfectivo = (seleccion && pendientes.some(p => p.ID_Partido === seleccion)) ? seleccion : (pendientes[0]?.ID_Partido || "");
      const partido = partidos.find((p) => p.ID_Partido === idEfectivo);
      const nombre = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;

      // Calcular disponibles directo, sin memo
      let disponibles = [];
      if (partido && jugadoras.length > 0) {
        const localId = (partido.ID_EquipoLocal || "").toLowerCase();
        const visitanteId = (partido.ID_EquipoVisitante || "").toLowerCase();
        disponibles = jugadoras.filter((j) => {
          const eqId = (j.ID_Equipo || "").toLowerCase();
          return eqId === localId || eqId === visitanteId;
        });
      }

      if (pendientes.length === 0) return <p className="px-4 py-6 text-sm" style={{ fontFamily: F_BODY, color: C.muted }}>No quedan partidos pendientes.</p>;

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ idPartido: idEfectivo, golesLocal: Number(golesLocal), golesVisitante: Number(golesVisitante), mvp: mvp || undefined }, () => { setGolesLocal(""); setGolesVisitante(""); setMvp(""); }); }}>
          <Campo label="Partido pendiente">
            <select style={estiloInput} value={idEfectivo} onChange={(e) => setSeleccion(e.target.value)}>
              {pendientes.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>Fecha {p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
            </select>
          </Campo>
          <div className="flex gap-3">
            <Campo label={`Goles ${partido ? nombre(partido.ID_EquipoLocal) : "local"}`}><input style={estiloInput} type="number" min="0" value={golesLocal} onChange={(e) => setGolesLocal(e.target.value)} required /></Campo>
            <Campo label={`Goles ${partido ? nombre(partido.ID_EquipoVisitante) : "visitante"}`}><input style={estiloInput} type="number" min="0" value={golesVisitante} onChange={(e) => setGolesVisitante(e.target.value)} required /></Campo>
          </div>
          <Campo label={`MVP del partido (${disponibles.length} jugadoras disponibles)`}>
            <select style={estiloInput} value={mvp} onChange={(e) => setMvp(e.target.value)}>
              <option value="">Sin elegir</option>
              {disponibles.map((j) => <option key={j.ID_Jugadora} value={j.ID_Jugadora}>{j.Nombre}</option>)}
            </select>
          </Campo>
          {disponibles.length === 0 && partido && <p className="text-[10px] mb-2" style={{ color: C.coral, fontFamily: F_BODY, wordBreak: "break-all" }}>
            DEBUG — Local: [{partido.ID_EquipoLocal}] Visitante: [{partido.ID_EquipoVisitante}] — Total jugadoras cargadas: {jugadoras.length} — Primeras 3 IDs equipo: {jugadoras.slice(0,3).map(j=>j.ID_Equipo).join(", ")}
          </p>}
          <BotonGuardar cargando={cargando}>Cargar resultado</BotonGuardar>
        </form>
      );
    }

    function VistaFixture({ equipos, partidos, onGuardar, onEditar, cargando }) {
      const [modo, setModo] = useState("crear");
      // Crear
      const [jornada, setJornada] = useState("");
      const [fecha, setFecha] = useState("");
      const [hora, setHora] = useState("");
      const [horaADefinir, setHoraADefinir] = useState(false);
      const [cancha, setCancha] = useState("");
      const [idLocal, setIdLocal] = useState(equipos[0]?.ID_Equipo || "");
      const [idVisitante, setIdVisitante] = useState(equipos[1]?.ID_Equipo || "");
      const [etapa, setEtapa] = useState("1");
      // Editar
      const pendientes = partidos.filter((p) => p.Jugado !== "SI");
      const [idEditar, setIdEditar] = useState(pendientes[0]?.ID_Partido || "");
      const [editFecha, setEditFecha] = useState("");
      const [editHora, setEditHora] = useState("");
      const [editHoraADefinir, setEditHoraADefinir] = useState(false);
      const [editCancha, setEditCancha] = useState("");

      useEffect(() => {
        if (pendientes.length > 0 && !idEditar) setIdEditar(pendientes[0].ID_Partido);
      }, [partidos]);

      const partidoEditar = partidos.find((p) => p.ID_Partido === idEditar);
      useEffect(() => {
        if (partidoEditar) {
          setEditFecha(String(partidoEditar.Fecha || "").slice(0, 10));
          setEditHora(String(partidoEditar.Hora || ""));
          setEditCancha(String(partidoEditar.Cancha || ""));
          setEditHoraADefinir(String(partidoEditar.Hora || "").toLowerCase() === "a definir");
        }
      }, [idEditar, partidos]);

      const nombre = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;

      // Indicador de zona/liga del equipo local
      const eqLocal = equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (idLocal || "").toLowerCase());
      const zonaInfo = eqLocal ? (etapa === "2" ? (eqLocal.Liga || "—") : (eqLocal.Zona || "—")) : "—";

      return (
        <div className="px-4 pb-6">
          <div className="flex gap-2 mb-4">
            <button type="button" onClick={() => setModo("crear")} className="flex-1 py-1.5 rounded-lg text-xs font-bold" style={{ background: modo === "crear" ? C.ink : "transparent", color: modo === "crear" ? C.gold : C.muted, border: `1px solid ${C.line}`, fontFamily: F_BODY }}>➕ CREAR</button>
            <button type="button" onClick={() => setModo("editar")} className="flex-1 py-1.5 rounded-lg text-xs font-bold" style={{ background: modo === "editar" ? C.ink : "transparent", color: modo === "editar" ? C.gold : C.muted, border: `1px solid ${C.line}`, fontFamily: F_BODY }}>✏️ EDITAR</button>
          </div>

          {modo === "crear" && (
            <form onSubmit={(e) => { e.preventDefault(); if (idLocal === idVisitante) return; onGuardar({ jornada: Number(jornada), fecha, hora: horaADefinir ? "A definir" : hora, cancha, idLocal, idVisitante, etapa }, () => { setJornada(""); setFecha(""); setHora(""); setCancha(""); setHoraADefinir(false); }); }}>
              <div className="flex gap-3">
                <Campo label="Jornada"><input style={estiloInput} type="number" min="1" value={jornada} onChange={(e) => setJornada(e.target.value)} required /></Campo>
                <Campo label="Etapa">
                  <select style={estiloInput} value={etapa} onChange={(e) => setEtapa(e.target.value)}>
                    <option value="1">Fase 1</option><option value="2">Fase 2</option>
                  </select>
                </Campo>
              </div>
              <div className="flex gap-3">
                <Campo label="Fecha"><input style={estiloInput} type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} required /></Campo>
                <Campo label="Hora">
                  {horaADefinir ? (
                    <input style={{...estiloInput, background: "#f0f0f0"}} value="A definir" disabled />
                  ) : (
                    <input style={estiloInput} type="time" value={hora} onChange={(e) => setHora(e.target.value)} required />
                  )}
                </Campo>
              </div>
              <label className="flex items-center gap-2 mb-3 cursor-pointer">
                <input type="checkbox" checked={horaADefinir} onChange={(e) => setHoraADefinir(e.target.checked)} />
                <span className="text-xs" style={{ fontFamily: F_BODY, color: C.muted }}>Hora a definir</span>
              </label>
              <Campo label="Cancha"><input style={estiloInput} value={cancha} onChange={(e) => setCancha(e.target.value)} placeholder="Cancha 1" required /></Campo>
              <div className="flex gap-3">
                <Campo label="Local"><select style={estiloInput} value={idLocal} onChange={(e) => setIdLocal(e.target.value)}>{equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}</select></Campo>
                <Campo label="Visitante"><select style={estiloInput} value={idVisitante} onChange={(e) => setIdVisitante(e.target.value)}>{equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}</select></Campo>
              </div>
              <div className="text-xs mb-3 px-1" style={{ fontFamily: F_BODY, color: C.teal }}>
                📍 Este partido se mostrará en: <strong>{etapa === "1" ? "Zona " : "Zona "}{zonaInfo}</strong>
              </div>
              {idLocal === idVisitante && <p className="text-xs mb-2" style={{ color: C.coral, fontFamily: F_BODY }}>Un equipo no puede jugar contra sí mismo.</p>}
              <BotonGuardar cargando={cargando}>Agregar partido</BotonGuardar>
            </form>
          )}

          {modo === "editar" && (
            <form onSubmit={(e) => { e.preventDefault(); onEditar({ idPartido: idEditar, fecha: editFecha, hora: editHoraADefinir ? "Horario a confirmar" : editHora, cancha: editCancha }); }}>
              {pendientes.length === 0 ? (
                <p className="text-sm py-4" style={{ fontFamily: F_BODY, color: C.muted }}>No hay partidos pendientes para editar.</p>
              ) : (
                <div>
                  <Campo label="Partido a editar">
                    <select style={estiloInput} value={idEditar} onChange={(e) => setIdEditar(e.target.value)}>
                      {pendientes.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>F{p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
                    </select>
                  </Campo>
                  <div className="flex gap-3">
                    <Campo label="Fecha"><input style={estiloInput} type="date" value={editFecha} onChange={(e) => setEditFecha(e.target.value)} /></Campo>
                    <Campo label="Hora">
                      {editHoraADefinir ? (
                        <input style={{...estiloInput, background: "#f0f0f0"}} value="A confirmar" disabled />
                      ) : (
                        <input style={estiloInput} type="time" value={editHora} onChange={(e) => setEditHora(e.target.value)} />
                      )}
                    </Campo>
                  </div>
                  <label className="flex items-center gap-2 mb-3 cursor-pointer">
                    <input type="checkbox" checked={editHoraADefinir} onChange={(e) => setEditHoraADefinir(e.target.checked)} />
                    <span className="text-xs" style={{ fontFamily: F_BODY, color: C.muted }}>Hora a confirmar</span>
                  </label>
                  <Campo label="Cancha"><input style={estiloInput} value={editCancha} onChange={(e) => setEditCancha(e.target.value)} /></Campo>
                  <BotonGuardar cargando={cargando}>Guardar cambios</BotonGuardar>
                </div>
              )}
            </form>
          )}
        </div>
      );
    }

    function VistaGoleo({ partidos, jugadoras, equipos, onGuardar, cargando }) {
      const jugados = partidos.filter((p) => p.Jugado === "SI");
      const [idPartido, setIdPartido] = useState(jugados[0]?.ID_Partido || "");
      const [idJugadora, setIdJugadora] = useState("");
      const [cantidad, setCantidad] = useState("");
      const partido = partidos.find((p) => p.ID_Partido === idPartido);
      const nombre = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;
      const disponibles = partido ? jugadoras.filter((j) => (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoLocal || "").toLowerCase() || (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoVisitante || "").toLowerCase()) : [];

      const jugLocal = disponibles.filter((j) => (j.ID_Equipo || "").toLowerCase() === (partido?.ID_EquipoLocal || "").toLowerCase()).sort((a, b) => (a.Nombre || "").localeCompare(b.Nombre || ""));
      const jugVisitante = disponibles.filter((j) => (j.ID_Equipo || "").toLowerCase() === (partido?.ID_EquipoVisitante || "").toLowerCase()).sort((a, b) => (a.Nombre || "").localeCompare(b.Nombre || ""));

      const opcionJugadora = (j) => {
        const dorsal = j.Dorsal && String(j.Dorsal).toUpperCase() !== "DT" ? ` (#${j.Dorsal})` : "";
        return `${j.Nombre}${dorsal}`;
      };

      if (jugados.length === 0) return <p className="px-4 py-6 text-sm" style={{ fontFamily: F_BODY, color: C.muted }}>Todavía no hay partidos jugados.</p>;

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ idPartido, idJugadora, cantidad: Number(cantidad) }, () => setCantidad("")); }}>
          <Campo label="Partido jugado">
            <select style={estiloInput} value={idPartido} onChange={(e) => { setIdPartido(e.target.value); setIdJugadora(""); }}>
              {jugados.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>Fecha {p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
            </select>
          </Campo>
          <Campo label="Jugadora">
            <select style={estiloInput} value={idJugadora} onChange={(e) => setIdJugadora(e.target.value)} required>
              <option value="">Elegir...</option>
              {jugLocal.length > 0 && <optgroup label={nombre(partido?.ID_EquipoLocal)}>
                {jugLocal.map((j) => <option key={j.ID_Jugadora} value={j.ID_Jugadora}>{opcionJugadora(j)}</option>)}
              </optgroup>}
              {jugVisitante.length > 0 && <optgroup label={nombre(partido?.ID_EquipoVisitante)}>
                {jugVisitante.map((j) => <option key={j.ID_Jugadora} value={j.ID_Jugadora}>{opcionJugadora(j)}</option>)}
              </optgroup>}
            </select>
          </Campo>
          <Campo label="Goles convertidos en este partido"><input style={estiloInput} type="number" min="0" value={cantidad} onChange={(e) => setCantidad(e.target.value)} required /></Campo>
          <BotonGuardar cargando={cargando}>Registrar goles</BotonGuardar>
        </form>
      );
    }

    function VistaNoticias({ onGuardar, cargando }) {
      const [titulo, setTitulo] = useState("");
      const [texto, setTexto] = useState("");
      const [imagenUrl, setImagenUrl] = useState("");
      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ titulo, texto, imagenUrl, publicada: true }, () => { setTitulo(""); setTexto(""); setImagenUrl(""); }); }}>
          <Campo label="Título"><input style={estiloInput} value={titulo} onChange={(e) => setTitulo(e.target.value)} required /></Campo>
          <Campo label="Texto"><textarea style={{ ...estiloInput, minHeight: 80, resize: "vertical" }} value={texto} onChange={(e) => setTexto(e.target.value)} required /></Campo>
          <Campo label="URL de imagen (opcional)"><input style={estiloInput} value={imagenUrl} onChange={(e) => setImagenUrl(e.target.value)} placeholder="https://..." /></Campo>
          <BotonGuardar cargando={cargando}>➕ Publicar noticia</BotonGuardar>
        </form>
      );
    }

    function VistaJugadoras({ jugadoras, equipos }) {
      const [busqueda, setBusqueda] = useState("");
      const [equipoFiltro, setEquipoFiltro] = useState("");

      const resultados = jugadoras.filter((j) => {
        const matchTexto = !busqueda || 
          (j.Nombre || "").toLowerCase().includes(busqueda.toLowerCase()) ||
          (j.DNI || "").replace(/\./g, "").includes(busqueda.replace(/\./g, ""));
        const matchEquipo = !equipoFiltro || (j.ID_Equipo || "").toLowerCase() === equipoFiltro.toLowerCase();
        return matchTexto && matchEquipo;
      });

      const nombreEquipo = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;

      return (
        <div className="px-4 pb-6">
          <p className="text-xs mb-3" style={{ fontFamily: F_BODY, color: C.muted }}>
            Consultá DNI y fecha de nacimiento para verificar identidad antes del partido.
          </p>
          <Campo label="Buscar por nombre o DNI">
            <input style={estiloInput} value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Nombre o número de DNI..." />
          </Campo>
          <Campo label="Filtrar por equipo">
            <select style={estiloInput} value={equipoFiltro} onChange={(e) => setEquipoFiltro(e.target.value)}>
              <option value="">Todos los equipos</option>
              {equipos.map((eq) => <option key={eq.ID_Equipo} value={eq.ID_Equipo}>{eq.Nombre}</option>)}
            </select>
          </Campo>

          <div className="text-xs mb-2" style={{ fontFamily: F_BODY, color: C.muted }}>
            {resultados.length} jugadora{resultados.length !== 1 ? "s" : ""}
          </div>

          <div className="space-y-2" style={{ maxHeight: 400, overflowY: "auto" }}>
            {resultados.map((j) => (
              <div key={j.ID_Jugadora} className="rounded-xl px-4 py-3" style={{ background: "#FFF", border: `1px solid ${C.line}` }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-sm font-medium" style={{ fontFamily: F_BODY, color: C.ink }}>{j.Nombre}</span>
                  <span className="text-xs px-2 py-0.5 rounded" style={{ background: "#F0F0F0", color: C.muted, fontFamily: F_BODY }}>#{j.Dorsal}</span>
                </div>
                <div className="text-xs" style={{ fontFamily: F_BODY, color: C.muted }}>
                  {nombreEquipo(j.ID_Equipo)}
                </div>
                <div className="flex gap-4 mt-1.5">
                  <div className="text-xs" style={{ fontFamily: F_BODY }}>
                    <span style={{ color: C.muted }}>DNI: </span>
                    <span style={{ color: C.ink, fontWeight: 600 }}>{j.DNI || "—"}</span>
                  </div>
                  <div className="text-xs" style={{ fontFamily: F_BODY }}>
                    <span style={{ color: C.muted }}>Nac: </span>
                    <span style={{ color: C.ink, fontWeight: 600 }}>{j.Fecha_Nacimiento ? String(j.Fecha_Nacimiento).slice(0, 10) : "—"}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function VistaControl({ partidos, jugadoras, equipos, apiUrl, token, onToast }) {
      const todos = partidos;
      const [idPartido, setIdPartido] = useState(todos[0]?.ID_Partido || "");
      const [verificadas, setVerificadas] = useState({});
      const [escaneando, setEscaneando] = useState(false);
      const [camaraLista, setCamaraLista] = useState(false);
      const [errorCam, setErrorCam] = useState("");
      const [guardando, setGuardando] = useState(false);
      const videoRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const intervalRef = React.useRef(null);
      const [ultimoEscaneo, setUltimoEscaneo] = useState("");

      const partido = todos.find((p) => p.ID_Partido === idPartido);
      const nombre = (id) => equipos.find((e) => (e.ID_Equipo || "").toLowerCase() === (id || "").toLowerCase())?.Nombre || id;

      const jugadorasPartido = partido ? jugadoras.filter((j) =>
        (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoLocal || "").toLowerCase() ||
        (j.ID_Equipo || "").toLowerCase() === (partido.ID_EquipoVisitante || "").toLowerCase()
      ).filter((j) => String(j.Dorsal).toUpperCase() !== "DT")
       .sort((a, b) => {
         const eqA = (a.ID_Equipo || "").toLowerCase();
         const eqB = (b.ID_Equipo || "").toLowerCase();
         if (eqA !== eqB) return eqA < eqB ? -1 : 1;
         return (a.Nombre || "").localeCompare(b.Nombre || "");
       }) : [];

      function normalizarDNI(dni) {
        return String(dni || "").replace(/\./g, "").replace(/\s/g, "").trim();
      }

      function extraerDNI(texto) {
        const partes = texto.split("@");
        if (partes.length >= 5) {
          for (const parte of partes) {
            const limpio = parte.replace(/\D/g, "");
            if (limpio.length >= 7 && limpio.length <= 8) return limpio;
          }
        }
        const match = texto.match(/\d{7,8}/);
        return match ? match[0] : null;
      }

      function verificarDNI(dniInput) {
        const dniLimpio = normalizarDNI(dniInput);
        const jugadora = jugadorasPartido.find((j) => normalizarDNI(j.DNI) === dniLimpio);
        if (jugadora) {
          setVerificadas((prev) => ({ ...prev, [jugadora.ID_Jugadora]: true }));
          setUltimoEscaneo("✅ " + jugadora.Nombre);
          return jugadora;
        }
        setUltimoEscaneo("❌ DNI " + dniLimpio + " no encontrado");
        return null;
      }

      const soportaScanner = "BarcodeDetector" in window;

      // Iniciar cámara: primero verifica soporte
      function iniciarScanner() {
        setErrorCam("");
        if (!soportaScanner) {
          setErrorCam("Tu navegador no soporta escaneo de códigos de barras (iOS Safari no lo soporta). Usá Chrome en Android para escanear, o ingresá el DNI manualmente abajo.");
          return;
        }
        setEscaneando(true);
        setCamaraLista(false);
      }

      // Cuando el video ya está en el DOM, conectamos la cámara
      useEffect(() => {
        if (!escaneando || !videoRef.current) return;
        let activo = true;

        (async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } } });
            if (!activo) { stream.getTracks().forEach((t) => t.stop()); return; }
            streamRef.current = stream;
            videoRef.current.srcObject = stream;
            videoRef.current.onloadedmetadata = () => { videoRef.current.play(); setCamaraLista(true); };

            if ("BarcodeDetector" in window) {
              const detector = new BarcodeDetector({ formats: ["pdf417", "code_128", "code_39", "qr_code"] });
              let ultimoDNI = "";
              intervalRef.current = setInterval(async () => {
                if (!videoRef.current || videoRef.current.readyState < 2) return;
                try {
                  const barcodes = await detector.detect(videoRef.current);
                  if (barcodes.length > 0) {
                    const dniExtraido = extraerDNI(barcodes[0].rawValue);
                    if (dniExtraido && dniExtraido !== ultimoDNI) {
                      ultimoDNI = dniExtraido;
                      verificarDNI(dniExtraido);
                      setTimeout(() => { ultimoDNI = ""; }, 3000);
                    }
                  }
                } catch {}
              }, 800);
            }
          } catch (err) {
            setErrorCam("No se pudo acceder a la cámara. Verificá los permisos del navegador.");
          }
        })();

        return () => {
          activo = false;
          if (intervalRef.current) clearInterval(intervalRef.current);
          if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
        };
      }, [escaneando]);

      function detenerScanner() {
        if (intervalRef.current) clearInterval(intervalRef.current);
        if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
        setEscaneando(false);
        setCamaraLista(false);
        setUltimoEscaneo("");
      }

      // Búsqueda manual
      const [dniManual, setDniManual] = useState("");
      function buscarManual() {
        if (!dniManual) return;
        verificarDNI(dniManual);
        setDniManual("");
      }

      // Guardar asistencia en el Sheet
      async function guardarAsistencia() {
        if (!apiUrl || !token) { onToast({ tipo: "error", mensaje: "Configurá la conexión primero" }); return; }
        setGuardando(true);
        try {
          const idsVerificadas = Object.keys(verificadas).filter((k) => verificadas[k]).join(",");
          const params = new URLSearchParams({ accion: "guardarAsistencia", token, idPartido, jugadorasPresentes: idsVerificadas });
          const data = await jsonp(`${apiUrl}?${params.toString()}`);
          if (!data.ok) throw new Error(data.error);
          onToast({ tipo: "ok", mensaje: `Asistencia guardada: ${idsVerificadas.split(",").length} jugadoras` });
        } catch (err) {
          onToast({ tipo: "error", mensaje: "Error al guardar: " + err.message });
        } finally {
          setGuardando(false);
        }
      }

      const localId = (partido?.ID_EquipoLocal || "").toLowerCase();
      const visitanteId = (partido?.ID_EquipoVisitante || "").toLowerCase();
      const jugLocal = jugadorasPartido.filter((j) => (j.ID_Equipo || "").toLowerCase() === localId);
      const jugVisitante = jugadorasPartido.filter((j) => (j.ID_Equipo || "").toLowerCase() === visitanteId);
      const totalVerif = Object.keys(verificadas).filter((k) => verificadas[k]).length;

      return (
        <div className="px-4 pb-6">
          <p className="text-xs mb-3" style={{ fontFamily: F_BODY, color: C.muted }}>
            Seleccioná un partido, verificá las jugadoras escaneando el DNI o manualmente, y guardá la asistencia.
          </p>

          <Campo label="Partido">
            <select style={estiloInput} value={idPartido} onChange={(e) => { setIdPartido(e.target.value); setVerificadas({}); detenerScanner(); }}>
              {todos.map((p) => <option key={p.ID_Partido} value={p.ID_Partido}>F{p.Jornada} · {nombre(p.ID_EquipoLocal)} vs {nombre(p.ID_EquipoVisitante)}</option>)}
            </select>
          </Campo>

          {/* Scanner */}
          <div className="mb-3">
            {!escaneando ? (
              <button type="button" onClick={iniciarScanner} className="w-full py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2"
                style={{ background: soportaScanner ? C.ink : C.muted, color: soportaScanner ? C.gold : "#FFF", fontFamily: F_BODY }}>
                📷 {soportaScanner ? "ESCANEAR DNI" : "ESCANEAR DNI (solo Chrome Android)"}
              </button>
            ) : (
              <div>
                <div className="relative rounded-lg overflow-hidden mb-2" style={{ background: "#000", minHeight: 200 }}>
                  <video ref={videoRef} className="w-full" style={{ display: "block", maxHeight: 250 }} playsInline muted autoPlay />
                  {!camaraLista && <div className="absolute inset-0 flex items-center justify-center"><span className="text-sm" style={{ color: "#FFF", fontFamily: F_BODY }}>Iniciando cámara...</span></div>}
                </div>
                {ultimoEscaneo && (
                  <div className="text-center text-sm font-bold mb-2 py-1.5 rounded-lg" style={{ background: ultimoEscaneo.startsWith("✅") ? "#dcfce7" : "#fee2e2", color: ultimoEscaneo.startsWith("✅") ? "#166534" : "#991b1b", fontFamily: F_BODY }}>
                    {ultimoEscaneo}
                  </div>
                )}
                <button type="button" onClick={detenerScanner} className="w-full py-2 rounded-lg text-xs font-bold"
                  style={{ background: C.coral, color: "#FFF", fontFamily: F_BODY }}>
                  ⏹ DETENER CÁMARA
                </button>
              </div>
            )}
            {errorCam && <p className="text-xs mt-1" style={{ color: C.coral, fontFamily: F_BODY }}>{errorCam}</p>}
          </div>

          {/* Búsqueda manual */}
          <div className="flex gap-2 mb-4">
            <input style={{ ...estiloInput, flex: 1 }} value={dniManual} onChange={(e) => setDniManual(e.target.value)} placeholder="Buscar por DNI..."
              onKeyDown={(e) => e.key === "Enter" && buscarManual()} />
            <button type="button" onClick={buscarManual} className="px-3 rounded-lg text-sm font-bold" style={{ background: C.teal, color: "#FFF", fontFamily: F_BODY }}>✓</button>
          </div>

          <div className="text-xs mb-2 flex items-center justify-between" style={{ fontFamily: F_BODY, color: C.muted }}>
            <span>{totalVerif} de {jugadorasPartido.length} verificadas</span>
            <div className="flex gap-2">
              {totalVerif > 0 && <button type="button" onClick={() => setVerificadas({})} className="text-xs" style={{ color: C.coral }}>Reiniciar</button>}
            </div>
          </div>

          {/* Lista por equipo */}
          {[{ id: localId, label: nombre(partido?.ID_EquipoLocal), jugadoras: jugLocal },
            { id: visitanteId, label: nombre(partido?.ID_EquipoVisitante), jugadoras: jugVisitante }].map((eq) => (
            <div key={eq.id} className="mb-3">
              <div className="text-xs font-bold uppercase tracking-wider mb-1.5 px-1" style={{ fontFamily: F_BODY, color: C.ink }}>{eq.label}</div>
              <div className="space-y-1">
                {eq.jugadoras.map((j) => {
                  const verif = verificadas[j.ID_Jugadora];
                  return (
                    <div key={j.ID_Jugadora} className="flex items-center justify-between rounded-lg px-3 py-2 cursor-pointer"
                      style={{ background: verif ? "#dcfce7" : "#FFF", border: `1px solid ${verif ? "#16a34a44" : C.line}` }}
                      onClick={() => setVerificadas((prev) => ({ ...prev, [j.ID_Jugadora]: !prev[j.ID_Jugadora] }))} >
                      <div style={{ fontFamily: F_BODY }}>
                        <span className="text-xs" style={{ color: C.ink }}>{j.Nombre}</span>
                        <span className="text-[10px] ml-1.5" style={{ color: C.muted }}>DNI: {j.DNI || "—"}</span>
                      </div>
                      <span className="text-sm">{verif ? "✅" : "⬜"}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {/* Guardar asistencia */}
          {totalVerif > 0 && (
            <button type="button" onClick={guardarAsistencia} disabled={guardando} className="w-full py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 mt-2"
              style={{ background: C.teal, color: "#FFF", fontFamily: F_BODY, opacity: guardando ? 0.7 : 1 }}>
              {guardando ? <span className="girando">⏳</span> : "💾"} GUARDAR ASISTENCIA ({totalVerif})
            </button>
          )}
        </div>
      );
    }

    function VistaConfig({ config, onGuardar, cargando }) {
      const [puntosVictoria, setPuntosVictoria] = useState(config.puntosVictoria ?? 3);
      const [puntosEmpate, setPuntosEmpate] = useState(config.puntosEmpate ?? 2);
      const [puntosDerrota, setPuntosDerrota] = useState(config.puntosDerrota ?? 1);

      useEffect(() => {
        setPuntosVictoria(config.puntosVictoria ?? 3);
        setPuntosEmpate(config.puntosEmpate ?? 2);
        setPuntosDerrota(config.puntosDerrota ?? 1);
      }, [config.puntosVictoria, config.puntosEmpate, config.puntosDerrota]);

      return (
        <form className="px-4 pb-6" onSubmit={(e) => { e.preventDefault(); onGuardar({ puntosVictoria: Number(puntosVictoria), puntosEmpate: Number(puntosEmpate), puntosDerrota: Number(puntosDerrota) }); }}>
          <p className="text-xs mb-3" style={{ fontFamily: F_BODY, color: C.muted }}>
            Define cuántos puntos suma cada equipo por victoria, empate y derrota. La tabla de posiciones se recalcula sola apenas guardás.
          </p>
          <div className="flex gap-3">
            <Campo label="Victoria"><input style={estiloInput} type="number" min="0" value={puntosVictoria} onChange={(e) => setPuntosVictoria(e.target.value)} required /></Campo>
            <Campo label="Empate"><input style={estiloInput} type="number" min="0" value={puntosEmpate} onChange={(e) => setPuntosEmpate(e.target.value)} required /></Campo>
            <Campo label="Derrota"><input style={estiloInput} type="number" min="0" value={puntosDerrota} onChange={(e) => setPuntosDerrota(e.target.value)} required /></Campo>
          </div>
          <BotonGuardar cargando={cargando}>Guardar puntos</BotonGuardar>
        </form>
      );
    }

    function App() {
      const [tab, setTab] = useState("resultados");
      const [configAbierta, setConfigAbierta] = useState(true);
      const DEFAULT_API = "https://script.google.com/macros/s/AKfycbxljAlRqwMJDc6Q6D4etOvFXHbDK9dfWl7FxOwQHYgivU2A8mL3qNs72rhOxHNNyiZE/exec";
      const [apiUrl, setApiUrl] = useState(() => localStorage.getItem("admin_apiUrl") || DEFAULT_API);
      const [token, setToken] = useState(() => localStorage.getItem("admin_token") || "");
      const [estadoConexion, setEstadoConexion] = useState("demo");
      const [rol, setRol] = useState(() => localStorage.getItem("admin_rol") || "");
      const [cargando, setCargando] = useState(false);
      const [toast, setToast] = useState(null);

      const [equipos, setEquipos] = useState(EQUIPOS_DEMO);
      const [jugadoras, setJugadoras] = useState(JUGADORAS_DEMO);
      const [partidos, setPartidos] = useState(PARTIDOS_DEMO);
      const [config, setConfig] = useState({ puntosVictoria: 3, puntosEmpate: 2, puntosDerrota: 1 });

      // Tabs visibles según rol
      const TABS_POR_ROL = {
        total: ["resultados", "fixture", "goleo", "control", "jugadoras", "noticias", "config"],
        carga: ["resultados", "fixture", "goleo"],
        control: ["control"],
      };
      const tabsVisibles = TABS.filter(t => !rol || (TABS_POR_ROL[rol] || []).includes(t.key));
      const rolLabel = { total: "Acceso total", control: "Solo control", carga: "Solo carga" };

      useEffect(() => { localStorage.setItem("admin_apiUrl", apiUrl); }, [apiUrl]);
      useEffect(() => { localStorage.setItem("admin_token", token); }, [token]);
      useEffect(() => { if (rol) localStorage.setItem("admin_rol", rol); }, [rol]);
      useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); }, [toast]);

      async function cargarDatosReales() {
        if (!apiUrl) return;
        try {
          const [eq, ju, pa, cfg] = await Promise.all([
            jsonp(`${apiUrl}?recurso=equipos`),
            jsonp(`${apiUrl}?recurso=jugadoras`),
            jsonp(`${apiUrl}?recurso=partidos`),
            jsonp(`${apiUrl}?recurso=configuracion`),
          ]);
          setEquipos(eq); setJugadoras(ju); setPartidos(pa);
          const porClave = Object.fromEntries((cfg || []).map((c) => [c.Clave, c.Valor]));
          setConfig({ puntosVictoria: porClave.PuntosVictoria ?? 3, puntosEmpate: porClave.PuntosEmpate ?? 2, puntosDerrota: porClave.PuntosDerrota ?? 1 });
          setEstadoConexion("ok");
        } catch {
          setEstadoConexion("error");
        }
      }

      useEffect(() => { if (apiUrl && token) cargarDatosReales(); }, []);

      async function probarConexion() {
        if (!apiUrl) { setEstadoConexion("demo"); return; }
        // Verificar rol con el token
        if (token) {
          try {
            const params = new URLSearchParams({ accion: "verificarRol", token });
            const res = await jsonp(`${apiUrl}?${params.toString()}`);
            if (res.ok && res.rol) {
              setRol(res.rol);
              localStorage.setItem("admin_rol", res.rol);
              await cargarDatosReales();
              // Seleccionar la primera tab disponible para este rol
              const disponibles = TABS_POR_ROL[res.rol] || [];
              if (disponibles.length > 0 && !disponibles.includes(tab)) setTab(disponibles[0]);
            } else {
              setEstadoConexion("error");
              setRol("");
              localStorage.removeItem("admin_rol");
            }
          } catch {
            setEstadoConexion("error");
          }
        } else {
          await cargarDatosReales();
        }
      }

      async function guardar(accion, payload, alExito) {
        setCargando(true);
        try {
          if (apiUrl && estadoConexion === "ok") {
            const params = new URLSearchParams({ accion, token });
            Object.entries(payload).forEach(([clave, valor]) => {
              if (valor !== undefined && valor !== null) params.set(clave, String(valor));
            });
            const data = await jsonp(`${apiUrl}?${params.toString()}`);
            if (!data.ok) throw new Error(data.error || "Error desconocido");
            setToast({ tipo: "ok", mensaje: data.mensaje || "Guardado" });
            cargarDatosReales();
          } else {
            setToast({ tipo: "ok", mensaje: "Guardado en modo demo (no se escribió en el Sheet)" });
          }
          alExito && alExito();
        } catch (err) {
          setToast({ tipo: "error", mensaje: "No se pudo guardar: " + err.message });
        } finally {
          setCargando(false);
        }
      }

      return (
        <div className="min-h-screen flex justify-center" style={{ background: "#E5E1D6" }}>
          <div className="w-full max-w-sm flex flex-col" style={{ background: C.paper, minHeight: "100vh" }}>
            <div className="px-4 pt-5 pb-4 flex items-start justify-between" style={{ background: C.ink }}>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span>🛡️</span>
                  <span className="text-[10px] tracking-[0.2em] uppercase" style={{ color: C.gold, fontFamily: F_BODY }}>Panel admin</span>
                </div>
                <h1 className="text-xl leading-tight" style={{ fontFamily: F_DISPLAY, fontWeight: 700, color: C.paper }}>LIGA FEMENINA<br />DE MAXI HANDBALL</h1>
              </div>
              <button onClick={() => setConfigAbierta(true)} className="mt-1" style={{ color: C.paper, fontSize: 20 }}>⚙️</button>
            </div>

            {estadoConexion !== "ok" && (
              <div className="px-4 py-2 text-center text-xs" style={{ background: "#FBEFD2", color: "#8A6300", fontFamily: F_BODY }}>
                Modo demo: los cambios no se guardan en tu Sheet. Tocá ⚙️ para conectar.
              </div>
            )}

            {estadoConexion === "ok" && rol && (
              <div className="px-4 py-1.5 text-center text-[10px]" style={{ background: C.teal, color: "#FFF", fontFamily: F_BODY }}>
                🔑 {rolLabel[rol] || rol}
              </div>
            )}

            <div className="flex px-4 pt-4 pb-3 gap-1 flex-wrap">
              {tabsVisibles.map((t) => (
                <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 flex flex-col items-center gap-1 py-2 rounded-lg" style={{ background: tab === t.key ? C.ink : "transparent", color: tab === t.key ? C.gold : C.muted, minWidth: tabsVisibles.length > 5 ? "18%" : "auto" }}>
                  <span>{t.icon}</span>
                  <span className="text-[10px]" style={{ fontFamily: F_BODY, fontWeight: 500 }}>{t.label}</span>
                </button>
              ))}
            </div>

            <div className="flex-1">
              {tab === "resultados" && <VistaResultados partidos={partidos} equipos={equipos} jugadoras={jugadoras} cargando={cargando} onGuardar={(p, cb) => guardar("cargarResultado", p, cb)} />}
              {tab === "fixture" && <VistaFixture equipos={equipos} partidos={partidos} cargando={cargando} onGuardar={(p, cb) => guardar("agregarPartido", p, cb)} onEditar={(p) => guardar("editarPartido", p)} />}
              {tab === "goleo" && <VistaGoleo partidos={partidos} jugadoras={jugadoras} equipos={equipos} cargando={cargando} onGuardar={(p, cb) => guardar("agregarGol", p, cb)} />}
              {tab === "control" && <VistaControl partidos={partidos} jugadoras={jugadoras} equipos={equipos} apiUrl={apiUrl} token={token} onToast={setToast} />}
              {tab === "jugadoras" && <VistaJugadoras jugadoras={jugadoras} equipos={equipos} />}
              {tab === "noticias" && <VistaNoticias cargando={cargando} onGuardar={(p, cb) => guardar("agregarNoticia", p, cb)} />}
              {tab === "config" && <VistaConfig config={config} cargando={cargando} onGuardar={(p) => guardar("actualizarConfig", p, () => setConfig(p))} />}
            </div>
          </div>

          <ModalConfig abierto={configAbierta} onCerrar={() => setConfigAbierta(false)} apiUrl={apiUrl} setApiUrl={setApiUrl} token={token} setToken={setToken} estadoConexion={estadoConexion} rol={rol} onProbar={probarConexion} />
          <Toast toast={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
